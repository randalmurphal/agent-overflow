name: "agent-overflow"
arch: ${GOARCH}
platform: "linux"
version: "0.0.8"
section: "devel"
priority: "optional"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "Desktop app for using coding agents with a shared UX"
vendor: "Agent Overflow"
homepage: "https://github.com/randalmurphal/agent-overflow"
license: "MIT"
release: "1"

contents:
  - src: "./bin/agent-overflow"
    dst: "/usr/local/bin/agent-overflow"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/agent-overflow.png"
  - src: "./build/linux/agent-overflow.desktop"
    dst: "/usr/share/applications/agent-overflow.desktop"

# Debian 12/Ubuntu 22.04+ with WebKitGTK 4.1.
depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0

# Distribution-specific dependency names for WebKitGTK.
overrides:
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1

  archlinux:
    depends:
      - gtk3
      - webkit2gtk-4.1

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"

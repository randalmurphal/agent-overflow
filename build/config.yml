# This file contains the configuration for this project.
# When you update `info` or `fileAssociations`, run `wails3 task common:update:build-assets` to update the assets.
# Note that this will overwrite any changes you have made to the assets.
version: '3'

# This information is used to generate the build assets.
info:
  companyName: "Agent Overflow"
  productName: "Agent Overflow"
  productIdentifier: "com.agentoverflow.app"
  description: "Desktop app for using coding agents with a shared UX"
  copyright: "(c) 2026, Randy Murphy"
  comments: "Desktop app for using coding agents with a shared UX"
  version: "0.0.12"
  # cfBundleIconName: "appicon" # The macOS icon name in Assets.car icon bundles (optional)
  #                               # Should match the name of your .icon file without the extension
  #                               # If not set and Assets.car exists, defaults to "appicon"

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      # `.claude/worktrees/agent-*/` are full repo checkouts spawned by
      # Claude Code's parallel-agent harness. Each contains hundreds of
      # `.go` / `.ts` files matching the watched_extension patterns
      # below; without this explicit exclude, Wails3's fsnotify watcher
      # registers thousands of watches at startup, hits OS file-handle
      # limits, and the dev process either fails to start or fires HMR
      # storms when a new worktree is created mid-session. `git_ignore`
      # below should cover this since `.claude/` is in `.gitignore`,
      # but the explicit entry is the load-bearing one — relying on
      # gitignore parsing alone has produced crashes (see incident
      # 2026-05-02).
      - .claude
      - .playwright-mcp
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
    watched_extension:
      - "*.go"
      - "*.js" # Watch for changes to JS/TS files included using the //wails:include directive.
      - "*.ts" # The frontend directory will be excluded entirely by the setting above.
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary

fileAssociations: []
other: []

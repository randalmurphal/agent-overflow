version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # Signing configuration - edit these values for your project
  # SIGN_CERTIFICATE: "path/to/certificate.pfx"
  # SIGN_THUMBPRINT: "certificate-thumbprint"  # Alternative to SIGN_CERTIFICATE
  # TIMESTAMP_SERVER: "http://timestamp.digicert.com"
  #
  # Password is stored securely in system keychain. Run: wails3 setup signing

  # Docker image for cross-compilation with CGO (used when CGO_ENABLED=1 on non-Windows)
  CROSS_IMAGE: wails-cross

tasks:
  build:
    summary: Builds the application for Windows
    cmds:
      # Auto-detect CGO: if CGO_ENABLED=1, use Docker; otherwise use native Go cross-compile
      - task: '{{if and (ne OS "windows") (eq .CGO_ENABLED "1")}}build:docker{{else}}build:native{{end}}'
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
    vars:
      # Default to CGO_ENABLED=0 if not explicitly set
      CGO_ENABLED: '{{.CGO_ENABLED | default "0"}}'

  build:wsl:
    summary: |
      Phase D: builds the WSL-backed Windows binary + the Linux ELF
      payload that runs inside WSL.

      This is the daily-driver Windows build. It does NOT use Wails'
      embedded asset host — the WSL-side backend serves the SPA over
      HTTP+WS via the Phase C transport. The Windows .exe is a thin
      launcher that:
        1. Picks a WSL distro (first launch) or reuses the saved one.
        2. Drops the bundled Linux ELF into ~/.local/bin inside WSL.
        3. Spawns the backend pinned to a Job Object so it dies with
           the Windows process.
        4. Points WebView2 at http://localhost:<port>/?t=<token>.

      Output:
        bin/agent-overflow.exe
        cmd/agent-overflow-windows/payload/agent-overflow-linux

      The Linux payload is rebuilt every time so a stale binary doesn't
      sneak into the embed. macOS hosts: this target writes a placeholder
      binary if Linux cross-compilation is unsupported by the toolchain.
    cmds:
      - task: build:wsl:linux-payload
      - task: build:wsl:windows-launcher
        vars:
          ARCH: '{{.ARCH | default "amd64"}}'
      # Restore the placeholder so the working tree returns to clean
      # after a build. The real ELF lives in bin/ for distribution; the
      # embed dir only needs the real bytes during the .exe link, which
      # has completed by this point. Keeps `git status` quiet across
      # repeated dev builds.
      - task: build:wsl:restore-payload-placeholder

  build:wsl:linux-payload:
    summary: |
      Cross-compile the Linux ELF backend bundled into the Windows .exe.

      Linux requires CGO (GTK bindings) for the full Wails build, and
      the alpha-76 -tags server path has a known interface mismatch
      that blocks pure-Go cross-compile. This task is a placeholder:
      run it on a Linux host or under Docker (build/docker/Dockerfile.cross
      via `task setup:docker`) where CGO + GTK are available.

      On macOS without Docker, this leaves the existing
      cmd/agent-overflow-windows/payload/agent-overflow-linux placeholder
      in place; the Windows .exe still builds but its embedded payload
      is not a real binary. Document this constraint in the release runbook.
    internal: true
    cmds:
      - mkdir -p cmd/agent-overflow-windows/payload {{.BIN_DIR | default "bin"}}
      - cmd: GOOS=linux GOARCH=amd64 CGO_ENABLED=1 CC=x86_64-linux-gnu-gcc go build -o cmd/agent-overflow-windows/payload/agent-overflow-linux ./
        platforms: [linux]
      - cmd: |
          if command -v docker > /dev/null 2>&1 && docker image inspect wails-cross > /dev/null 2>&1; then
            docker run --rm -v "$(pwd):/app" -w /app wails-cross sh -c \
              'GOOS=linux GOARCH=amd64 CGO_ENABLED=1 go build -o cmd/agent-overflow-windows/payload/agent-overflow-linux ./'
          else
            echo "WARNING: skipping Linux payload cross-compile (run on Linux or set up Docker via 'task setup:docker')."
            echo "         The existing cmd/agent-overflow-windows/payload/agent-overflow-linux placeholder is unchanged."
          fi
        platforms: [darwin]
      # Stash a copy in bin/ (gitignored) so package:wsl:zip and any
      # follow-on consumer can read the real ELF after the build:wsl
      # task restores the embed-dir placeholder.
      - cp cmd/agent-overflow-windows/payload/agent-overflow-linux {{.BIN_DIR | default "bin"}}/agent-overflow-linux
    sources:
      - "main.go"
      - "app*.go"
      - "internal/**/*.go"
      - "go.mod"
      - "go.sum"
      # frontend/dist is `//go:embed`-ed by main.go, so a stale embed
      # links into the .exe even when SPA source changed. Watching the
      # built artifacts (not src/) keeps this cheap — Vite produces
      # exactly the files this rebuild needs as input.
      - "frontend/dist/**/*"
    generates:
      - cmd/agent-overflow-windows/payload/agent-overflow-linux
      - "{{.BIN_DIR | default \"bin\"}}/agent-overflow-linux"

  build:wsl:restore-payload-placeholder:
    desc: |
      Rewrites cmd/agent-overflow-windows/payload/agent-overflow-linux
      back to its committed placeholder content. Called at the tail of
      build:wsl so the working tree stays clean — the real ELF is
      already in the linked .exe (and copied to bin/ for downstream
      packagers). The embed dir's only role is to satisfy //go:embed at
      compile time; once the link is done, the bytes on disk there are
      dead weight and shouldn't show up in `git status`.
    internal: true
    cmds:
      - cmd: printf 'PLACEHOLDER - replace with cross-compiled Linux ELF before shipping\n' > cmd/agent-overflow-windows/payload/agent-overflow-linux
      # `go build` writes the ELF with mode 0755; `printf >` preserves
      # whatever mode bits were on the file before. Force 0644 so the
      # restored placeholder matches the committed file mode and `git
      # diff` doesn't surface a mode-only change.
      - chmod 644 cmd/agent-overflow-windows/payload/agent-overflow-linux

  build:wsl:windows-launcher:
    summary: Cross-compile the Windows .exe launcher
    internal: true
    deps:
      - task: build:wsl:linux-payload
    cmds:
      # Restore the real Linux ELF into the embed dir before linking.
      # build:wsl:linux-payload's up-to-date check sees the placeholder
      # file (written by build:wsl:restore-payload-placeholder at the
      # tail of the prior build) and skips the cross-compile, so the
      # embed dir would otherwise still hold the 68-byte placeholder
      # when only cmd/agent-overflow-windows/**/* changed. //go:embed
      # would then bake the placeholder into the .exe and the WSL-side
      # spawn fails with "child closed" (exec format error). Copying
      # from the bin/ stash, which linux-payload writes alongside the
      # embed-dir copy and which never gets clobbered, is the cheap
      # always-correct restore.
      - cp {{.BIN_DIR | default "bin"}}/agent-overflow-linux cmd/agent-overflow-windows/payload/agent-overflow-linux
      - GOOS=windows GOARCH={{.ARCH}} CGO_ENABLED=0 go build -trimpath -ldflags "-H windowsgui -X main.payloadVersion={{.VERSION | default "dev"}}" -o {{.BIN_DIR | default "bin"}}/{{.APP_NAME | default "agent-overflow"}}.exe ./cmd/agent-overflow-windows
    sources:
      - "cmd/agent-overflow-windows/**/*"
      - "internal/wsllauncher/**/*"
      - "{{.BIN_DIR | default \"bin\"}}/agent-overflow-linux"
    generates:
      - "{{.BIN_DIR | default \"bin\"}}/{{.APP_NAME | default \"agent-overflow\"}}.exe"

  package:wsl:zip:
    summary: |
      Bundles the WSL-backed Windows binary + Linux payload into a zip.
      Use this on macOS / Linux hosts where Inno Setup isn't installed.
      For a real installer, run `iscc build/windows/installer.iss` on
      a Windows host with Inno Setup 6+ available on PATH.
    deps:
      - task: build:wsl
    cmds:
      - mkdir -p {{.BIN_DIR | default "bin"}}/wsl-zip
      - cp {{.BIN_DIR | default "bin"}}/agent-overflow.exe {{.BIN_DIR | default "bin"}}/wsl-zip/
      # Read from bin/ (where build:wsl:linux-payload also stashes the
      # ELF) rather than the embed dir, which build:wsl restores to a
      # placeholder right after the .exe link.
      - cp {{.BIN_DIR | default "bin"}}/agent-overflow-linux {{.BIN_DIR | default "bin"}}/wsl-zip/
      - cd {{.BIN_DIR | default "bin"}}/wsl-zip && zip -r ../agent-overflow-wsl.zip ./*
      - rm -rf {{.BIN_DIR | default "bin"}}/wsl-zip

  build:native:
    summary: Builds the application using native Go cross-compilation
    internal: true
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          DEV:
            ref: .DEV
      - task: common:generate:icons
    cmds:
      - task: generate:syso
      - go build {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe"
      - cmd: powershell Remove-item *.syso
        platforms: [windows]
      - cmd: rm -f *.syso
        platforms: [linux, darwin]
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if .EXTRA_TAGS}}-tags {{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui"{{end}}'
    env:
      GOOS: windows
      CGO_ENABLED: '{{.CGO_ENABLED | default "0"}}'
      GOARCH: '{{.ARCH | default ARCH}}'

  build:docker:
    summary: Cross-compiles for Windows using Docker with Zig (for CGO builds on non-Windows)
    internal: true
    deps:
      - task: common:build:frontend
      - task: common:generate:icons
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required for CGO cross-compilation. Please install Docker."
      - sh: docker image inspect {{.CROSS_IMAGE}} > /dev/null 2>&1
        msg: |
          Docker image '{{.CROSS_IMAGE}}' not found.
          Build it first: wails3 task setup:docker
    cmds:
      - task: generate:syso
      - docker run --rm -v "{{.ROOT_DIR}}:/app" {{.GO_CACHE_MOUNT}} {{.REPLACE_MOUNTS}} -e APP_NAME="{{.APP_NAME}}" {{if .EXTRA_TAGS}}-e EXTRA_TAGS="{{.EXTRA_TAGS}}"{{end}} {{.CROSS_IMAGE}} windows {{.DOCKER_ARCH}}
      - docker run --rm -v "{{.ROOT_DIR}}:/app" alpine chown -R $(id -u):$(id -g) /app/bin
      - rm -f *.syso
    vars:
      DOCKER_ARCH: '{{.ARCH | default "amd64"}}'
      # Mount Go module cache for faster builds
      GO_CACHE_MOUNT:
        sh: 'echo "-v ${GOPATH:-$HOME/go}/pkg/mod:/go/pkg/mod"'
      # Extract replace directives from go.mod and create -v mounts for each
      REPLACE_MOUNTS:
        sh: |
          grep -E '^replace .* => ' go.mod 2>/dev/null | while read -r line; do
            path=$(echo "$line" | sed -E 's/^replace .* => //' | tr -d '\r')
            # Convert relative paths to absolute
            if [ "${path#/}" = "$path" ]; then
              path="$(cd "$(dirname "$path")" 2>/dev/null && pwd)/$(basename "$path")"
            fi
            # Only mount if directory exists
            if [ -d "$path" ]; then
              echo "-v $path:$path:ro"
            fi
          done | tr '\n' ' '

  package:
    summary: Packages the application
    cmds:
      - task: '{{if eq (.FORMAT | default "nsis") "msix"}}create:msix:package{{else}}create:nsis:installer{{end}}'
    vars:
      FORMAT: '{{.FORMAT | default "nsis"}}'

  generate:syso:
    summary: Generates Windows `.syso` file
    dir: build
    cmds:
      - wails3 generate syso -arch {{.ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_{{.ARCH}}.syso
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  create:nsis:installer:
    summary: Creates an NSIS installer
    dir: build/windows/nsis
    deps:
      - task: build
    cmds:
      # Create the Microsoft WebView2 bootstrapper if it doesn't exist
      - wails3 generate webview2bootstrapper -dir "{{.ROOT_DIR}}/build/windows/nsis"
      - | 
        {{if eq OS "windows"}}
        makensis -DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}\{{.BIN_DIR}}\{{.APP_NAME}}.exe" project.nsi
        {{else}}
        makensis -DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe" project.nsi
        {{end}}
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      ARG_FLAG: '{{if eq .ARCH "amd64"}}AMD64{{else}}ARM64{{end}}'

  create:msix:package:
    summary: Creates an MSIX package
    deps:
      - task: build
    cmds:
      - |-
        wails3 tool msix \
          --config "{{.ROOT_DIR}}/wails.json" \
          --name "{{.APP_NAME}}" \
          --executable "{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe" \
          --arch "{{.ARCH}}" \
          --out "{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}-{{.ARCH}}.msix" \
          {{if .CERT_PATH}}--cert "{{.CERT_PATH}}"{{end}} \
          {{if .PUBLISHER}}--publisher "{{.PUBLISHER}}"{{end}} \
          {{if .USE_MSIX_TOOL}}--use-msix-tool{{else}}--use-makeappx{{end}}
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      CERT_PATH: '{{.CERT_PATH | default ""}}'
      PUBLISHER: '{{.PUBLISHER | default ""}}'
      USE_MSIX_TOOL: '{{.USE_MSIX_TOOL | default "false"}}'

  install:msix:tools:
    summary: Installs tools required for MSIX packaging
    cmds:
      - wails3 tool msix-install-tools

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}.exe'

  sign:
    summary: Signs the Windows executable
    desc: |
      Signs the .exe with an Authenticode certificate.
      Configure SIGN_CERTIFICATE or SIGN_THUMBPRINT in the vars section at the top of this file.
      Password is retrieved from system keychain (run: wails3 setup signing)
    deps:
      - task: build
    cmds:
      - wails3 tool sign --input "{{.BIN_DIR}}/{{.APP_NAME}}.exe" {{if .SIGN_CERTIFICATE}}--certificate {{.SIGN_CERTIFICATE}}{{end}} {{if .SIGN_THUMBPRINT}}--thumbprint {{.SIGN_THUMBPRINT}}{{end}} {{if .TIMESTAMP_SERVER}}--timestamp {{.TIMESTAMP_SERVER}}{{end}}
    preconditions:
      - sh: '[ -n "{{.SIGN_CERTIFICATE}}" ] || [ -n "{{.SIGN_THUMBPRINT}}" ]'
        msg: "Either SIGN_CERTIFICATE or SIGN_THUMBPRINT is required. Set it in the vars section at the top of build/windows/Taskfile.yml"

  sign:installer:
    summary: Signs the NSIS installer
    desc: |
      Creates and signs the NSIS installer.
      Configure SIGN_CERTIFICATE or SIGN_THUMBPRINT in the vars section at the top of this file.
      Password is retrieved from system keychain (run: wails3 setup signing)
    deps:
      - task: create:nsis:installer
    cmds:
      - wails3 tool sign --input "build/windows/nsis/{{.APP_NAME}}-installer.exe" {{if .SIGN_CERTIFICATE}}--certificate {{.SIGN_CERTIFICATE}}{{end}} {{if .SIGN_THUMBPRINT}}--thumbprint {{.SIGN_THUMBPRINT}}{{end}} {{if .TIMESTAMP_SERVER}}--timestamp {{.TIMESTAMP_SERVER}}{{end}}
    preconditions:
      - sh: '[ -n "{{.SIGN_CERTIFICATE}}" ] || [ -n "{{.SIGN_THUMBPRINT}}" ]'
        msg: "Either SIGN_CERTIFICATE or SIGN_THUMBPRINT is required. Set it in the vars section at the top of build/windows/Taskfile.yml"

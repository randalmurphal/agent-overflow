version: '3'

tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    cmds:
      - go mod tidy

  install:frontend:deps:
    summary: Install frontend dependencies
    dir: frontend
    sources:
      - package.json
      - pnpm-lock.yaml
    generates:
      - node_modules
    preconditions:
      - sh: pnpm --version
        msg: "pnpm not found. Install with `npm i -g pnpm@10.33.2` or via https://pnpm.io/installation."
    cmds:
      - pnpm install --frozen-lockfile

  build:frontend:
    label: build:frontend (DEV={{.DEV}})
    summary: Build the frontend project
    dir: frontend
    # Always rebuilt: no sources/generates fingerprint. See generate:bindings.
    method: none
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
    cmds:
      - pnpm --silent run {{.BUILD_COMMAND}}
    env:
      PRODUCTION: '{{if eq .DEV "true"}}false{{else}}true{{end}}'
    vars:
      BUILD_COMMAND: '{{if eq .DEV "true"}}build:dev{{else}}build{{end}}'

  build:frontend:no-bindings:
    label: build:frontend:no-bindings (DEV={{.DEV}})
    summary: Build the frontend project after platform-specific bindings were generated
    dir: frontend
    # Always rebuilt: no sources/generates fingerprint. See generate:bindings.
    method: none
    deps:
      - task: install:frontend:deps
    cmds:
      - pnpm --silent run {{.BUILD_COMMAND}}
    env:
      PRODUCTION: '{{if eq .DEV "true"}}false{{else}}true{{end}}'
    vars:
      BUILD_COMMAND: '{{if eq .DEV "true"}}build:dev{{else}}build{{end}}'

  generate:bindings:
    label: generate:bindings (BUILD_FLAGS={{.BUILD_FLAGS}})
    summary: Generates bindings for the frontend
    deps:
      - task: go:mod:tidy
    # Always regenerated, like build:frontend above: no sources/generates
    # fingerprint. Task's checksum method walks source globs following
    # symlinks and SWALLOWS a glob error, so one dangling symlink under the
    # tree (a gitignored node_modules left behind by a relocated package
    # was enough) empties the source set and freezes the fingerprint:
    # every later build reports
    # "up to date" and ships whatever dist/ and bindings/ already hold. On
    # 2026-09-03 that shipped a pre-merge frontend inside a post-merge
    # backend. Twelve seconds a build is the price of a gate that is true.
    method: none
    cmds:
      # -time-type is deliberately left at its default (Go time.Time → TS
      # `string`, RFC3339 on the wire). The `Date` mode emits
      # $Create.DateFromTime, a runtime helper that would have to exist in
      # three places we maintain in parallel: the @wailsio/runtime npm types
      # (pinned pre-.95, the version that introduced it), the production
      # transport shim (frontend/src/lib/transport/runtime.ts Create.*), and
      # the vitest mock (frontend/src/test/mocks/wailsio-runtime.ts). No
      # frontend consumer needs Date semantics today; if one does, prefer
      # `new Date(field)` at the consumer over switching the generator.
      - wails3 generate bindings -f '{{.BUILD_FLAGS}}' -clean=true -ts

  generate:icons:
    summary: Generates Windows `.ico` and Mac `.icns` from per-platform sources. macOS uses the rounded-tile `appicon.png` (and on macOS hosts the `appicon.icon` Asset Catalog, which yields `Assets.car`). Windows uses `appicon-square.png` — a square, fully-opaque tile — because pre-baked rounded corners with transparent edges render as white on Windows surfaces that don't honor alpha; modern Windows shells apply their own corner mask.
    dir: build
    sources:
      - "appicon.png"
      - "appicon-square.png"
      - "appicon.icon"
    generates:
      - "darwin/icons.icns"
      - "windows/icon.ico"
    cmds:
      # wails3 beta defaults -windowsfilename/-macfilename to build/windows/… /
      # build/darwin/… (resolved against this task's cwd, build/), so each
      # single-platform run must explicitly blank the other platform's output
      # or the CLI dies on the nonexistent build/build/ parent directory.
      - wails3 generate icons -input appicon.png -macfilename darwin/icons.icns -iconcomposerinput appicon.icon -macassetdir darwin -windowsfilename ""
      - wails3 generate icons -input appicon-square.png -windowsfilename windows/icon.ico -macfilename ""

  dev:frontend:
    summary: Runs the frontend in development mode
    dir: frontend
    deps:
      - task: install:frontend:deps
    cmds:
      - pnpm run dev --port {{.VITE_PORT}} --strictPort

  update:build-assets:
    summary: Updates the build assets
    dir: build
    cmds:
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    desc: |
      Builds the Docker image needed for cross-compiling to any platform.
      Run this once to enable cross-platform builds from any OS.
    cmds:
      - docker build -t wails-cross -f build/docker/Dockerfile.cross build/docker/
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required. Please install Docker first."

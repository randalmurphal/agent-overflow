<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <title>Agent Overflow App Icon</title>
  <desc>AO monogram on a flat near-black rounded tile.</desc>

  <!-- Tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="#0B0E14"/>

  <!-- AO monogram -->
  <g fill="none" stroke="#F8FAFC" stroke-width="62" stroke-linecap="round" stroke-linejoin="round">
    <!-- A: clean chevron, softly-rounded apex, no crossbar -->
    <path d="M 156 686 L 324 338 L 492 686"/>
    <!-- O -->
    <circle cx="710" cy="512" r="174"/>
  </g>
</svg>

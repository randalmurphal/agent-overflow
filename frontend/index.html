<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: a phone browser's soft keyboard shrinks the
         LAYOUT viewport (the default shrinks only the visual one and
         leaves the composer under the keyboard). The Android shell's
         WebView resizes the same way, so both clients hand the scroll
         controller the same viewport change. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Agent Overflow</title>
  </head>
  <body>
    <!--
      First-paint theme stamp: an empty style element in the BODY, filled
      before paint by public/boot-theme.js, which carries the whole rationale
      (why it is a file rather than an inline script under the CSP, why it is
      classic rather than a module, and why this element belongs here rather
      than in <head>).

      This document holds NO inline script and NO inline style, which is what
      lets the shipped Content-Security-Policy say script-src 'self' with no
      hash and no nonce. indexHtmlNoInlineScript.test.ts fails on a
      reintroduction of either.
    -->
    <style id="user-theme"></style>
    <script src="/boot-theme.js"></script>
    <div id="app"></div>
    <script src="./src/main.ts" type="module"></script>
  </body>
</html>

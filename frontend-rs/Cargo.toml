[package]
name = "agent-overflow-rs"
version = "0.0.1"
edition = "2021"
publish = false
description = "GPUI frontend spike for Agent Overflow. Connects to the existing Go backend over its HTTP+WebSocket transport."

[lib]
name = "agent_overflow_rs"
path = "src/lib.rs"

[[bin]]
name = "agent-overflow-rs"
path = "src/main.rs"

[[example]]
name = "smoke"
path = "examples/smoke.rs"

[dependencies]
gpui = { version = "0.2", default-features = true }
gpui-component = { version = "0.5", default-features = false }

# Transport
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
# No TLS features — connection is always loopback ws://. The Go side
# documents TLS termination as out-of-process (Tailscale Serve / SSH /
# reverse proxy), so the client side speaks plaintext WS only. Dropping
# rustls also removes `ring` from the dep graph, which is the usual
# pain point for cross-compiling to Windows from Linux.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
url = "2"
http = "1"

# Encoding + types
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fnv = "1"
bytes = "1"
ulid = { version = "1", features = ["serde"] }

# Errors + tracing + small utils
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
parking_lot = "0.12"
once_cell = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

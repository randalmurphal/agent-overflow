import com.android.build.api.variant.HostTestBuilder

apply plugin: 'com.android.application'

// The SPA version is shared with the desktop; the shell build increases
// whenever a new APK is distributed, independently of bundle-only updates.
def appVersion = new groovy.json.JsonSlurper().parse(file('../../../frontend/package.json')).version
def shellBuild = file('../../shell-build.txt').text.trim().toInteger()
def releaseStore = System.getenv('AO_ANDROID_KEYSTORE')

android {
    namespace = "dev.agentoverflow.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.agentoverflow.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode shellBuild
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseStore) {
            release {
                storeFile file(releaseStore)
                storePassword System.getenv('AO_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('AO_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('AO_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (releaseStore) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// AGP 9 creates unit tests only for the tested (debug) build type.
// build-apk.sh runs testReleaseUnitTest before assembleRelease, so the
// release variant keeps its JVM tests.
androidComponents {
    beforeVariants(selector().withBuildType('release')) { variant ->
        variant.hostTests[HostTestBuilder.UNIT_TEST_TYPE].enable = true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:${rootProject.ext.androidxAppCompatVersion}"
    implementation "androidx.coordinatorlayout:coordinatorlayout:${rootProject.ext.androidxCoordinatorLayoutVersion}"
    implementation "androidx.core:core-splashscreen:${rootProject.ext.coreSplashScreenVersion}"
    implementation project(':capacitor-android')
    // Push (docs/specs/remote-access.md §9). UNCONDITIONAL, and that was
    // checked rather than assumed: the library needs the google-services
    // plugin to INITIALISE, not to compile. Without google-services.json
    // there is simply no default FirebaseApp, PushPlugin.getToken answers
    // its typed "not configured", and the APK builds and runs with no
    // push — which is this box's state and a state a release is allowed
    // to be in. Making the dependency itself conditional would mean two
    // source sets, one of which nobody compiles.
    implementation "com.google.firebase:firebase-messaging:${rootProject.ext.firebaseMessagingVersion}"
    implementation "com.squareup.okhttp3:okhttp:${rootProject.ext.okhttpVersion}"
    testImplementation "com.squareup.okhttp3:mockwebserver3:${rootProject.ext.okhttpVersion}"
    testImplementation "com.squareup.okhttp3:okhttp-tls:${rootProject.ext.okhttpVersion}"
    testImplementation "junit:junit:${rootProject.ext.junitVersion}"
    testImplementation "org.mockito:mockito-core:5.24.0"
    testImplementation "androidx.webkit:webkit:${rootProject.ext.androidxWebkitVersion}"
    testImplementation "org.apache.cordova:framework:${rootProject.ext.cordovaAndroidVersion}"
    // The bundle state file is JSON, and `org.json` on the unit-test
    // classpath is android.jar's STUB, whose every method throws. The
    // real implementation from Maven shadows it, which is what lets
    // BundleStoreTest exercise the whole update mechanic on the JVM
    // instead of needing an emulator for it (mobile/AGENTS.md).
    testImplementation "org.json:json:${rootProject.ext.orgJsonVersion}"
    androidTestImplementation "androidx.test.ext:junit:${rootProject.ext.androidxJunitVersion}"
    androidTestImplementation "androidx.test.espresso:espresso-core:${rootProject.ext.androidxEspressoCoreVersion}"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

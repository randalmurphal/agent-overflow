# golangci-lint configuration (v2 schema). `make go-lint` runs it; CI gates
# new issues only (--new-from-patch) until the existing backlog is cleared,
# then the gate widens to the whole tree. unused and exhaustive have no
# backlog and also run over the whole tree (`make go-lint-whole-tree`). The
# default linter set is on:
# errcheck, govet, ineffassign, staticcheck and unused. No findings are
# excluded here beyond forbidigo's scope below: an unchecked Close in this
# repo is a real finding under its cleanup rule, not noise.
#
# exhaustive is on in its strict form: a switch over an enum names every
# constant, and a default case does not stand in for one. It reports at the
# switch, not at the constant, so it also runs over the whole tree: a
# constant added to an enum is reported at every
# switch over it, touched by the change or not. Code that picks a few
# constants out of an enum and treats the rest alike is therefore written
# with `if`, not `switch`, which is why staticcheck's QF1003 ("could use
# tagged switch") is off; its other checks keep golangci-lint's defaults.
# Two types are exempt because no switch over them is a dispatch:
# reflect.Kind (no code handles all of Go's type kinds) and
# eventchan.Channel (a tap subscribes to a few channel names).
#
# forbidigo keeps the browser's native engines on uicall: in
# internal/browser only the adapter that builds uiThread calls Wails'
# Invoke* (internal/browser/AGENTS.md). Other packages post to their own
# UI loops, so the rule is scoped to that tree.
version: "2"

run:
  timeout: 20m

linters:
  enable:
    - exhaustive
    - forbidigo
  settings:
    exhaustive:
      ignore-enum-types: ^(reflect\.Kind|agent-overflow/internal/eventchan\.Channel)$
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1003
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^application\.Invoke
          pkg: ^github\.com/wailsapp/wails/v3/pkg/application$
          msg: post to the UI thread through uiThread (internal/browser/native_uithread.go), whose Run withdraws an operation it did not start in time
  exclusions:
    rules:
      - path-except: ^internal/browser/
        linters:
          - forbidigo

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      go:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # Upstream commits the generated parser only to its gh-pages branch,
      # so tagged releases do not compile; go.mod pins a gh-pages commit.
      - dependency-name: github.com/DerekStride/tree-sitter-sql
  - package-ecosystem: npm
    directories:
      - /
      - /frontend
      - /e2e
      - /mobile
    schedule:
      interval: weekly
      day: monday
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # happy-dom 20.12 added Element.animate() and its Animation.cancel()
      # leaves a rejected promise unhandled, which fails every Svelte
      # transition torn down mid-animation (capricorn86/happy-dom#2339,
      # fix in #2340). Lift when a release carries the fix.
      - dependency-name: happy-dom
        versions: [">=20.12.0"]
      # svelte-check supports TypeScript ^5 || ^6; the packages keep one
      # TypeScript pin, so it moves when svelte-check does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @types/node follows the Node major the packages run on.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # The runtime must match the Go Wails fork in go.mod (its replace
      # line); bump both together by hand.
      - dependency-name: "@wailsio/runtime"
  - package-ecosystem: gradle
    directory: /mobile/android
    schedule:
      interval: weekly
      day: monday
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday

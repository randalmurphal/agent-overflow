name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job calls a Make target so a local run is the same check
# (docs/architecture/development.md, Continuous integration). The composite
# action in .github/actions/setup owns toolchain pins and caches.
jobs:
  # The Linux Go checks share one job: each needs the same toolchain, GTK
  # headers and frontend bundle, which cost more than the checks themselves.
  go-checks:
    name: gofmt, go vet, go build and bindings
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          go: "true"
          gtk: "true"
          node: "true"
          frontend-dist: "true"
          cache-name: checks
      - run: make fmt-check
      - run: make go-vet
      - run: make go-build
      - name: Compile the provider smoke tests
        run: make provider-smoke-compile
      - name: Install the Wails CLI
        run: go install tool
      - run: make bindings-check

  build-macos:
    name: Go build (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          go: "true"
          node: "true"
          frontend-dist: "true"
          cache-name: build-macos
      - run: make go-build

  go-lint:
    name: golangci-lint (new issues) and govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          go: "true"
          gtk: "true"
          node: "true"
          frontend-dist: "true"
          cache-name: lint
      - name: Resolve the change under test
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-change.sh "$RUNNER_TEMP/change"
      - name: golangci-lint on the change
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: make go-lint GO_LINT_FLAGS="--new-from-patch=$RUNNER_TEMP/change/change.diff"
      - run: make go-vuln

  frontend:
    name: svelte-check, build and oxlint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          node: "true"
          frontend-deps: "true"
      - run: pnpm --dir frontend run check
      - run: pnpm --dir frontend run build
      - name: Resolve the change under test
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-change.sh "$RUNNER_TEMP/change"
      - name: oxlint the changed frontend files
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: |
          set -euo pipefail
          # Only the files a change touches are gated, with warnings denied,
          # until the warning backlog is cleared; then the whole tree is.
          files=$(grep -E '^frontend/(src|scripts)/.*\.(ts|js|mjs|cjs|svelte)$' "$RUNNER_TEMP/change/files" | sed 's|^frontend/||' | tr '\n' ' ' || true)
          if [[ -z "$files" ]]; then
            echo "No frontend sources changed."
            exit 0
          fi
          # shellcheck disable=SC2086
          make frontend-lint OXLINT_FLAGS="--deny-warnings $files"

  # Three shards: internal/store is the longest package by far, app and
  # triage are the next two, and the rest fits beside them. The release
  # candidate script test rides with the rest.
  go-test:
    name: Go tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: store
            packages: ./internal/store/...
            exclude: ""
          - shard: app-triage
            packages: . ./internal/app/... ./internal/triage/...
            exclude: ""
          - shard: rest
            packages: . ./cmd/... ./internal/...
            exclude: ^agent-overflow(/internal/(store|app|triage)(/.*)?)?$
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          go: "true"
          gtk: "true"
          node: "true"
          frontend-dist: "true"
          netns: "true"
          cache-name: test-${{ matrix.shard }}
      - run: make go-test GO_TEST_PKGS="${{ matrix.packages }}" GO_TEST_EXCLUDE="${{ matrix.exclude }}"
      - name: Release candidate script tests
        if: matrix.shard == 'rest'
        run: bin/ao-netns node --test scripts/release-candidate.test.mjs

  vitest:
    name: Vitest (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: unit
            script: test
            browsers: ""
          - project: browser
            script: test:browser
            browsers: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          go: "true"
          node: "true"
          frontend-deps: "true"
          browsers: ${{ matrix.browsers }}
          netns: "true"
          cache-name: netns
      - run: make netns-tool
      - name: Run the ${{ matrix.project }} project
        working-directory: frontend
        run: AO_PERF_CONTRACT=1 ../bin/ao-netns pnpm run ${{ matrix.script }}

  e2e:
    name: Playwright harness suite (shard ${{ matrix.shard }} of 8)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          go: "true"
          gtk: "true"
          node: "true"
          frontend-deps: "true"
          e2e-deps: "true"
          browsers: chromium webkit
          netns: "true"
          cache-name: harness
      - run: make e2e E2E_ARGS="--shard=${{ matrix.shard }}/8"
        env:
          AO_E2E_WORKERS: "2"
      - name: Upload failure traces and the report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: |
            e2e/test-results
            e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

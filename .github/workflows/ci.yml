name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# Container jobs would otherwise get sh as the default step shell.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job runs a Make target, or a binary `make harness-build` built, so
# a local run is the same check (docs/architecture/development.md,
# Continuous integration). The toolchain job resolves the image the Linux
# jobs run in (ci/Dockerfile) and decides which suites a pull request runs
# (scripts/ci-suites.mjs); .github/actions/setup prepares the runner and
# installs anything a change moved past the image, and a job that used it
# ends with .github/actions/cache-save. The macOS job runs on the bare
# runner. Jobs that start the isolated test network namespace run the
# container privileged with the host's kernel modules mounted, so the
# namespace and the dummy link module reach the host kernel. Every container
# runs with an init process so orphaned children are reaped; the runner's
# own PID 1 in a container never reaps, which leaves zombies the process
# group sweeps would otherwise wait on.
#
# The toolchain job publishes the run's plan (scripts/ci-suites.mjs): every
# other job, each true or false. Each job's `if` reads its own key, and the
# CI result job fails unless every job the plan selected succeeded and
# every one it excluded was skipped (scripts/ci-suites.test.mjs holds this
# file to that shape). Only cache-cleanup, which runs on a push alone,
# holds actions: write: it is the one job that deletes cache entries.
jobs:
  toolchain:
    name: Toolchain image and suites
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain-image
        id: image
        with:
          # A fork or Dependabot token cannot publish; the action then runs
          # the jobs on the newest main image.
          push: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
          token: ${{ github.token }}
      # A pull request runs the jobs its changed paths can reach; a push
      # or a manual run runs every suite (scripts/ci-suites.mjs names the
      # jobs each event leaves out).
      - name: Plan the run
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            scripts/ci-change.sh "$RUNNER_TEMP/change"
            node scripts/ci-suites.mjs plan "$GITHUB_EVENT_NAME" "$RUNNER_TEMP/change/paths" > "$RUNNER_TEMP/plan"
          else
            node scripts/ci-suites.mjs plan "$GITHUB_EVENT_NAME" > "$RUNNER_TEMP/plan"
          fi
          cat "$RUNNER_TEMP/plan" >> "$GITHUB_OUTPUT"
          { echo '```'; cat "$RUNNER_TEMP/plan"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # The Linux Go checks share one job: each needs the same toolchain and
  # frontend bundle, which cost more than the checks themselves.
  go-checks:
    name: gofmt, go mod tidy, go vet, go build and bindings
    needs: toolchain
    if: fromJSON(needs.toolchain.outputs.plan || '{}')['go-checks']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --init
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          go: "true"
          gtk: "true"
          node: "true"
          frontend-dist: "true"
          cache-name: checks
      - run: make fmt-check
      - run: make tidy-check
      - run: make go-vet
      - run: make go-build
      - name: Compile the provider smoke tests
        run: make provider-smoke-compile
      - name: Install the Wails CLI
        run: go install tool
      - run: make bindings-check
      - uses: ./.github/actions/cache-save

  build-macos:
    name: Go build (macOS)
    needs: toolchain
    if: fromJSON(needs.toolchain.outputs.plan || '{}')['build-macos']
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          go: "true"
          node: "true"
          frontend-dist: "true"
          cache-name: build-macos
      - run: make go-build
      # Every file only macOS compiles is in the default file set, so one
      # pass covers them; the lint job runs the other sets and the Windows
      # launcher's. The pass stays whole-tree: 158 of the 264 packages
      # compile a darwin-only file or depend on one, and an enum's members
      # come from the package that declares it.
      - name: exhaustive on the files macOS compiles
        run: make go-lint GO_LINT_FLAGS="--enable-only exhaustive"
      # The orphan reaper is a script macOS's own /bin/sh runs; no other job
      # executes it there.
      - name: Run the orphan reaper under macOS sh
        run: make go-test GO_TEST_PKGS=./internal/orphanreaper GO_TEST_FLAGS='-count=1 -run Sidecar'
      - uses: ./.github/actions/cache-save

  go-lint:
    name: golangci-lint (new issues) and govulncheck
    needs: toolchain
    if: fromJSON(needs.toolchain.outputs.plan || '{}')['go-lint']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --init
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          go: "true"
          gtk: "true"
          node: "true"
          frontend-dist: "true"
          cache-name: lint
      - name: Resolve the change under test
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-change.sh "$RUNNER_TEMP/change"
      - name: Choose the golangci-lint binary
        run: |
          set -euo pipefail
          # The image carries golangci-lint at the Makefile's pin; a pin
          # the image has not caught up with falls back to the Makefile's
          # own build of it.
          if golangci-lint version 2>/dev/null | grep -q "version $(sed -n 's/^GOLANGCI_LINT_VERSION *:= *v//p' Makefile) "; then
            echo "GOLANGCI_LINT=golangci-lint" >> "$GITHUB_ENV"
          fi
      - name: golangci-lint on the change
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: make go-lint GO_LINT_FLAGS="--new-from-patch=$RUNNER_TEMP/change/change.diff"
      # exhaustive has no backlog, and a constant added to an enum is
      # reported at the switches over it, which the change need not touch.
      # The macOS job runs the linter for the files only macOS compiles.
      - name: exhaustive on the whole tree
        run: make go-lint-exhaustive
      - run: make go-vuln
      - uses: ./.github/actions/cache-save

  frontend:
    name: svelte-check, build and oxlint
    needs: toolchain
    if: fromJSON(needs.toolchain.outputs.plan || '{}')['frontend']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --init
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          node: "true"
          frontend-deps: "true"
      - run: pnpm --dir frontend run check
      - run: pnpm --dir frontend run build
      - name: Resolve the change under test
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-change.sh "$RUNNER_TEMP/change"
      - name: oxlint the changed frontend files
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: |
          set -euo pipefail
          # Only the files a change touches are gated, with warnings denied,
          # until the warning backlog is cleared; then the whole tree is.
          files=$(grep -E '^frontend/(src|scripts)/.*\.(ts|js|mjs|cjs|svelte)$' "$RUNNER_TEMP/change/files" | sed 's|^frontend/||' | tr '\n' ' ' || true)
          if [[ -z "$files" ]]; then
            echo "No frontend sources changed."
            exit 0
          fi
          # shellcheck disable=SC2086
          make frontend-lint OXLINT_FLAGS="--deny-warnings $files"

  # Four shards: internal/store is the longest package by far, app and
  # triage are the next two, and the rest fits beside them. The noremote
  # shard runs, compiled with -tags noremote, every package whose test
  # binary the tag changes (make go-test-noremote: 79 of 263 packages,
  # store and app among them). Every shard but store sets up the bundle,
  # which the root package embeds: app-triage and noremote test the root
  # package, and in rest the provider-poison guard lists every test binary,
  # the root's included (internal/testutil/providerpath). Every shard runs
  # on every change: the Go test cache, restored from main, reports a
  # package whose code, dependencies and the files its tests read are
  # unchanged as (cached). Those files' times are set from their content
  # first (scripts/ci-stable-mtimes.mjs), after the last step that writes
  # into the checkout.
  go-test:
    name: Go tests (${{ matrix.shard }})
    needs: toolchain
    if: fromJSON(needs.toolchain.outputs.plan || '{}')['go-test']
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --init --privileged -v /lib/modules:/lib/modules:ro
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: store
            packages: ./internal/store/...
            exclude: ""
            bundle: "false"
          - shard: app-triage
            packages: . ./internal/app/... ./internal/triage/...
            exclude: ""
            bundle: "true"
          - shard: rest
            packages: ./cmd/... ./internal/...
            exclude: ^agent-overflow/internal/(store|app|triage)(/.*)?$
            bundle: "true"
          - shard: noremote
            packages: ""
            exclude: ""
            bundle: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          go: "true"
          gtk: "true"
          node: "true"
          frontend-dist: ${{ matrix.bundle }}
          netns: "true"
          cache-name: test-${{ matrix.shard }}
      - run: make netns-tool
      - name: Give the checkout content-derived times
        run: node scripts/ci-stable-mtimes.mjs stamp "$RUNNER_TEMP/stamped.json"
      - name: Go tests
        if: matrix.shard != 'noremote'
        run: make go-test GO_TEST_PKGS="${{ matrix.packages }}" GO_TEST_EXCLUDE="${{ matrix.exclude }}"
      - name: Go tests without remote access
        if: matrix.shard == 'noremote'
        run: make go-test-noremote
      - name: Script tests
        if: matrix.shard == 'rest'
        run: make script-tests
      - name: Name what the tests wrote inside the checkout
        if: always()
        run: node scripts/ci-stable-mtimes.mjs moved "$RUNNER_TEMP/stamped.json"
      - uses: ./.github/actions/cache-save

  vitest:
    name: Vitest (${{ matrix.project }})
    needs: toolchain
    if: fromJSON(needs.toolchain.outputs.plan || '{}')['vitest']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      actions: write
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --init --privileged -v /lib/modules:/lib/modules:ro
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: unit
            browsers: ""
          - project: browser
            browsers: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          go: "true"
          node: "true"
          frontend-deps: "true"
          browsers: ${{ matrix.browsers }}
          netns: "true"
          cache-name: netns
      - run: make vitest-${{ matrix.project }}
      - uses: ./.github/actions/cache-save

  # One build of the binaries and the frontend/dist they embed, which the
  # Playwright shards and the upgrade lineage check download as one unit.
  # It typechecks the suite before it packs, so a type error publishes no
  # artifact, and the jobs that run it set AO_E2E_TYPECHECKED=1: a shard
  # compiles no Go, runs no vite and no tsc. tar keeps the executable bits
  # an artifact would drop. The artifact lives 7 days. Re-running failed
  # jobs reuses it and does not rerun this job, so after that, re-run this
  # job, which re-runs the jobs that need it.
  harness-build:
    name: Harness build
    needs: toolchain
    if: fromJSON(needs.toolchain.outputs.plan || '{}')['harness-build']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --init
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          go: "true"
          gtk: "true"
          node: "true"
          frontend-deps: "true"
          e2e-deps: "true"
          cache-name: harness
      - run: make harness-build
      - name: Typecheck the Playwright suite once for every shard
        run: bin/ao-harness-e2e --typecheck
      - name: Pack what a Playwright run reads
        run: tar --zstd -cf "$RUNNER_TEMP/harness-bin.tar.zst" bin frontend/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-bin
          path: ${{ runner.temp }}/harness-bin.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: ./.github/actions/cache-save

  # A shard runs bin/ao-harness-e2e from the harness build, Playwright from
  # e2e/node_modules, and the browsers run-inputs.mk declares: the image
  # carries all but the regular Chromium build, which make e2e-browsers
  # installs. The launcher's preflight names any input that is missing.
  e2e:
    name: Playwright harness suite (shard ${{ matrix.shard }} of 8)
    needs: [toolchain, harness-build]
    if: fromJSON(needs.toolchain.outputs.plan || '{}')['e2e']
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --init --privileged -v /lib/modules:/lib/modules:ro
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      # First, so a re-run whose artifact has expired fails in seconds.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: harness
        continue-on-error: true
        with:
          name: harness-bin
          path: ${{ runner.temp }}
      - name: Require the harness build
        if: steps.harness.outcome != 'success'
        run: |
          echo "::error title=Harness build missing::This run's harness-bin artifact is gone (it lives 7 days) or was never uploaded. Re-running failed jobs does not rebuild it: re-run all jobs."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          node: "true"
          e2e-deps: "true"
          netns: "true"
      - run: make e2e-browsers
      - name: Unpack the harness build
        run: tar --zstd -xf "$RUNNER_TEMP/harness-bin.tar.zst"
      - run: bin/ao-harness-e2e --shard=${{ matrix.shard }}/8
        env:
          AO_E2E_WORKERS: "3"
      - name: Upload failure traces and the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: |
            e2e/test-results
            e2e/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  # The release upgrade check against the newest release's published corpus,
  # on a pull request whose changes can break a migration or the check
  # itself and on a manual run, never on a push to main, which repeats its
  # pull request (scripts/ci-suites.mjs). The per-PR schema coverage gate is a spec in
  # the Playwright suite; this job is the lineage leg
  # (docs/architecture/release-upgrade-check.md). It runs the script `make
  # release-upgrade-check` runs, on the harness build's binaries.
  upgrade-lineage:
    name: Upgrade lineage check
    needs: [toolchain, harness-build]
    if: fromJSON(needs.toolchain.outputs.plan || '{}')['upgrade-lineage']
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: ${{ needs.toolchain.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
      options: --init --privileged -v /lib/modules:/lib/modules:ro
    steps:
      # First, so a re-run whose artifact has expired fails in seconds.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: harness
        continue-on-error: true
        with:
          name: harness-bin
          path: ${{ runner.temp }}
      - name: Require the harness build
        if: steps.harness.outcome != 'success'
        run: |
          echo "::error title=Harness build missing::This run's harness-bin artifact is gone (it lives 7 days) or was never uploaded. Re-running failed jobs does not rebuild it: re-run all jobs."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          node: "true"
          e2e-deps: "true"
          netns: "true"
      - name: Unpack the harness build
        run: tar --zstd -xf "$RUNNER_TEMP/harness-bin.tar.zst"
      - name: Migrate the newest release's corpus with this build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: scripts/release-upgrade-check.sh --scale 1 --report "$RUNNER_TEMP/upgrade-report.json"
      - name: Summarize
        if: always()
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/upgrade-report.json" ]]; then
            { echo '```json'; cat "$RUNNER_TEMP/upgrade-report.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-lineage
          path: e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

  dependency-review:
    name: Dependency review
    needs: toolchain
    if: fromJSON(needs.toolchain.outputs.plan || '{}')['dependency-review']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # After a push's jobs saved their caches, each retiring its own slot's
  # previous entry: retires what those could not and the legacy key shapes,
  # and fails once the caches pass the budget under GitHub's 10 GB cap
  # (scripts/ci-cache-cleanup.mjs).
  cache-cleanup:
    name: Actions cache cleanup
    needs: [toolchain, go-checks, build-macos, go-lint, go-test, vitest, harness-build]
    if: always() && fromJSON(needs.toolchain.outputs.plan || '{}')['cache-cleanup']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-cache-cleanup.mjs

  # The check the branch ruleset is to require (docs/architecture/
  # development.md names the change): it passes only when every job ran as
  # the plan says (scripts/ci-suites.mjs verdict).
  ci-result:
    name: CI result
    needs: [toolchain, go-checks, build-macos, go-lint, frontend, go-test, vitest, harness-build, e2e, upgrade-lineage, dependency-review, cache-cleanup]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          PLAN: ${{ needs.toolchain.outputs.plan }}
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-suites.mjs verdict

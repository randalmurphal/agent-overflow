name: Release build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to build. Leave empty to use build/config.yml.
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  linux-wsl:
    name: Linux and WSL artifacts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "${REQUESTED_VERSION}" ]]; then
            version="${REQUESTED_VERSION#v}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^  version: "\([^"]*\)"/\1/p' build/config.yml)"
          fi
          case "$version" in
            ""|.*|-*|*..*|*[!0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz._+-]*)
              echo "Unsafe version: $version" >&2
              exit 2
              ;;
          esac
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libgtk-4-dev libwebkitgtk-6.0-dev zip

      - name: Install project tools
        run: |
          corepack enable
          make install

      - name: Verify committed release metadata
        run: |
          ./scripts/sync-release-version.sh "$VERSION"
          git diff --exit-code

      - name: Build release artifacts
        run: ./scripts/build-release.sh --version "$VERSION" --skip-macos

      - name: Upload raw Linux and WSL artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-wsl-raw
          path: |
            dist/release/${{ env.VERSION }}/agent-overflow-linux-amd64
            dist/release/${{ env.VERSION }}/agent-overflow-headless-linux-amd64
            dist/release/${{ env.VERSION }}/agent-overflow-wsl-amd64.exe
          if-no-files-found: error

  macos:
    name: macOS artifact
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "${REQUESTED_VERSION}" ]]; then
            version="${REQUESTED_VERSION#v}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^  version: "\([^"]*\)"/\1/p' build/config.yml)"
          fi
          case "$version" in
            ""|.*|-*|*..*|*[!0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz._+-]*)
              echo "Unsafe version: $version" >&2
              exit 2
              ;;
          esac
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install project tools
        run: |
          corepack enable
          make install

      - name: Verify committed release metadata
        run: |
          ./scripts/sync-release-version.sh "$VERSION"
          git diff --exit-code

      - name: Build macOS app bundle
        env:
          # actool in Xcode 26.4-26.6 crashes on Icon Composer .icon bundles
          # ("attempt to insert nil object", Apple regression FB20183399;
          # see expo/expo#46121). wails3 generate icons compiles
          # build/appicon.icon with /usr/bin/actool, which resolves through
          # DEVELOPER_DIR, so pin the newest Xcode whose actool works.
          # Verified per-version on this runner image (spike 2026-07-11):
          # 26.0-26.3 compile the bundle, 26.4+ crash. Related: the bundle's
          # icon.json must not carry a `translucency` key — the headless
          # icon renderer dies with "Icon export exited with status 255"
          # on it (bisected in the same spike). Drop the pin once a fixed
          # Xcode ships.
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
        run: |
          VERSION="$VERSION" wails3 task darwin:package
          mkdir -p "dist/release/$VERSION"
          ( cd bin && zip -qr "../dist/release/$VERSION/agent-overflow-darwin-arm64.zip" "agent-overflow.app" )

      - name: Upload raw macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-raw
          path: dist/release/${{ env.VERSION }}/agent-overflow-darwin-arm64.zip
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install tools and dependencies
        run: |
          corepack enable
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir mobile install --frozen-lockfile
      - name: Check version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version="$(node -p "require('./frontend/package.json').version")"
          expected="${REQUESTED_VERSION#v}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then expected="${GITHUB_REF_NAME#v}"; fi
          if [[ -n "$expected" && "$version" != "$expected" ]]; then
            echo "Sync release metadata before building Android." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build signed APK
        env:
          AO_ANDROID_KEYSTORE_BASE64: ${{ secrets.AO_ANDROID_KEYSTORE_BASE64 }}
          AO_ANDROID_KEYSTORE: ${{ runner.temp }}/agent-overflow-release.jks
          AO_ANDROID_STORE_PASSWORD: ${{ secrets.AO_ANDROID_STORE_PASSWORD }}
          AO_ANDROID_KEY_ALIAS: ${{ secrets.AO_ANDROID_KEY_ALIAS }}
          AO_ANDROID_KEY_PASSWORD: ${{ secrets.AO_ANDROID_KEY_PASSWORD }}
          AO_ANDROID_GOOGLE_SERVICES_BASE64: ${{ secrets.AO_ANDROID_GOOGLE_SERVICES_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$AO_ANDROID_KEYSTORE_BASE64" || { echo "Configure Android release signing secrets first." >&2; exit 1; }
          trap 'rm -f "$AO_ANDROID_KEYSTORE" mobile/android/app/google-services.json' EXIT
          printf '%s' "$AO_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$AO_ANDROID_KEYSTORE"
          if [[ -n "$AO_ANDROID_GOOGLE_SERVICES_BASE64" ]]; then
            printf '%s' "$AO_ANDROID_GOOGLE_SERVICES_BASE64" | base64 --decode > mobile/android/app/google-services.json
          fi
          mobile/scripts/build-apk.sh release
      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: android-raw
          path: dist/release/${{ env.VERSION }}/agent-overflow-android.apk
          if-no-files-found: error

  package:
    name: Package release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - linux-wsl
      - macos
      - android

    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "${REQUESTED_VERSION}" ]]; then
            version="${REQUESTED_VERSION#v}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^  version: "\([^"]*\)"/\1/p' build/config.yml)"
          fi
          case "$version" in
            ""|.*|-*|*..*|*[!0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz._+-]*)
              echo "Unsafe version: $version" >&2
              exit 2
              ;;
          esac
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Download Linux and WSL artifacts
        uses: actions/download-artifact@v8
        with:
          name: linux-wsl-raw
          path: dist/release/${{ env.VERSION }}

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: macos-raw
          path: dist/release/${{ env.VERSION }}

      - name: Download Android APK
        uses: actions/download-artifact@v8
        with:
          name: android-raw
          path: dist/release/${{ env.VERSION }}

      - name: Package install assets
        shell: bash
        run: ./scripts/package-release-assets.sh "dist/release/$VERSION"

      - name: Upload packaged release artifact
        uses: actions/upload-artifact@v7
        with:
          name: agent-overflow-release-${{ env.VERSION }}
          path: dist/release/${{ env.VERSION }}/*
          if-no-files-found: error

      - name: Publish GitHub release assets
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="v$VERSION"
          # Write-once: a published release is the integrity anchor clients pull
          # and verify against, so refuse to overwrite one. Re-running or
          # re-pushing a tag fails loudly instead of silently swapping the bytes
          # users download. Delete the release by hand to deliberately republish.
          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "Release $release_tag already exists — refusing to overwrite published assets." >&2
            echo "Delete the release manually if you intend to republish this tag." >&2
            exit 1
          fi
          # --generate-notes builds the body from merged PRs/commits since the
          # previous tag; the client renders it in the Updates panel.
          gh release create "$release_tag" \
            --title "Agent Overflow $release_tag" \
            --generate-notes \
            dist/release/"$VERSION"/*

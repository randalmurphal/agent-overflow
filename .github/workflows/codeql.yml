name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@d208ec71e39ae46397cbf6569bef8439b9aab974 # codeql-bundle-v2.27.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config: |
            paths-ignore:
              - frontend/bindings
              - frontend/dist
              - "**/node_modules"
              - e2e/test-results
      # The Go extractor compiles the module, which needs the cgo webview
      # headers and the embedded frontend bundle.
      - uses: ./.github/actions/setup
        if: matrix.language == 'go'
        with:
          go: "true"
          gtk: "true"
          node: "true"
          frontend-dist: "true"
          cache-name: codeql
      - name: Build for the Go extractor
        if: matrix.language == 'go'
        run: go build ./...
      - uses: github/codeql-action/analyze@d208ec71e39ae46397cbf6569bef8439b9aab974 # codeql-bundle-v2.27.2
        with:
          category: /language:${{ matrix.language }}

name: Save caches
description: >-
  The last step of a job that ran .github/actions/setup. On a push to main
  it saves the caches setup restored, under the keys and paths setup named
  (scripts/ci-cache.mjs): the Go build cache cut to the entries this job
  used (scripts/ci-go-cache.mjs), and the frontend bundle, the Go module
  cache and the pnpm store when their exact key was missed. It deletes
  nothing: the push's cache-cleanup job retires superseded entries. Any
  other event saves nothing, so a pull request never writes a cache.

runs:
  using: composite
  steps:
    - name: Cut the Go build cache to what this job used
      if: github.event_name == 'push' && env.AO_CACHE_GO_BUILD_KEY != ''
      shell: bash
      run: node scripts/ci-go-cache.mjs prune "$AO_CACHE_GO_BUILD_PATH" "$RUNNER_TEMP/go-cache-state.json"

    - name: Save the Go build cache
      if: github.event_name == 'push' && env.AO_CACHE_GO_BUILD_KEY != ''
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.AO_CACHE_GO_BUILD_PATH }}
        key: ${{ env.AO_CACHE_GO_BUILD_KEY }}

    - name: Save the Go module cache
      if: github.event_name == 'push' && env.AO_CACHE_GO_MOD_KEY != '' && env.AO_CACHE_GO_MOD_HIT != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.AO_CACHE_GO_MOD_PATH }}
        key: ${{ env.AO_CACHE_GO_MOD_KEY }}

    - name: Save the pnpm store
      if: github.event_name == 'push' && env.AO_CACHE_PNPM_KEY != '' && env.AO_CACHE_PNPM_HIT != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.AO_CACHE_PNPM_PATH }}
        key: ${{ env.AO_CACHE_PNPM_KEY }}

    - name: Save the frontend bundle
      if: github.event_name == 'push' && env.AO_CACHE_FRONTEND_DIST_KEY != '' && env.AO_CACHE_FRONTEND_DIST_HIT != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.AO_CACHE_FRONTEND_DIST_PATH }}
        key: ${{ env.AO_CACHE_FRONTEND_DIST_KEY }}

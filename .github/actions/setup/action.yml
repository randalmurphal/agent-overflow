name: Set up toolchains
description: >-
  Gives a CI job the toolchains it needs, with caches. Every input is opt-in
  so a job pays only for what it runs. Linux jobs run in the toolchain image
  (ci/Dockerfile), which carries everything at the pins; there this action
  only prepares the runner and installs what a change moved past the image.
  The macOS job runs on the bare runner and installs from the pins here.

inputs:
  go:
    description: Provide Go (version from go.mod) with the module cache and a per-job build cache. A job that sets it ends with .github/actions/cache-save.
    default: "false"
  gtk:
    description: Provide the GTK4 and WebKitGTK headers the cgo webview needs.
    default: "false"
  node:
    description: Provide pnpm and Node; off the image, with the package store cache, which .github/actions/cache-save saves.
    default: "false"
  frontend-deps:
    description: Install frontend dependencies (frontend/).
    default: "false"
  frontend-dist:
    description: Build frontend/dist, which the Go root package embeds; Go builds, vet and tests need it.
    default: "false"
  e2e-deps:
    description: Install e2e dependencies (e2e/).
    default: "false"
  browsers:
    description: Playwright browsers to provide, space separated (chromium, webkit), with OS dependencies. Empty provides none.
    default: ""
  netns:
    description: Allow the isolated test network namespace (unprivileged user namespaces, dummy link type).
    default: "false"
  cache-name:
    description: Name of the Go build cache slot, usually the job name; jobs with different build tags keep separate caches.
    default: default

runs:
  using: composite
  steps:
    # The image sets AO_CI_TOOLCHAIN. Expressions cannot see a container's
    # environment, so a step reports it.
    - name: Detect the toolchain image
      id: image
      shell: bash
      run: |
        if [[ "${AO_CI_TOOLCHAIN:-}" == "1" ]]; then
          echo "baked=true" >> "$GITHUB_OUTPUT"
          echo "Running in the toolchain image."
        else
          echo "baked=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install GTK and WebKitGTK headers
      if: inputs.gtk == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if pkg-config --exists gtk4 webkitgtk-6.0; then
          echo "GTK headers present."
          exit 0
        fi
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends gcc pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

    - name: Allow the isolated test network namespace
      if: inputs.netns == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # Ubuntu 24.04 refuses unprivileged user namespaces through AppArmor
        # (internal/netisolate names the sysctl). The dummy link type is a
        # module, and module autoload is refused from a user namespace. In
        # the image the job runs as uid 1001 with passwordless sudo; the
        # container is privileged with the host's modules mounted (ci.yml),
        # so both commands reach the host kernel.
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        sudo modprobe dummy

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      if: inputs.go == 'true' && steps.image.outputs.baked != 'true'
      with:
        go-version-file: go.mod
        cache: false

    # Every cache this action restores follows one rule: every job restores,
    # and only a push to main saves, through .github/actions/cache-save as
    # the job's last step. A pull request's own save could serve only that
    # pull request, and its size would push main's caches out of GitHub's
    # 10 GB. Each step records its key in the environment for that save.
    - name: Restore the Go module cache
      if: inputs.go == 'true' && steps.image.outputs.baked != 'true'
      id: go-mod
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/pkg/mod
        key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
        restore-keys: |
          go-mod-${{ runner.os }}-

    - name: Record the Go module cache
      if: inputs.go == 'true' && steps.image.outputs.baked != 'true'
      shell: bash
      env:
        KEY: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
        HIT: ${{ steps.go-mod.outputs.cache-hit }}
      run: |
        {
          echo "AO_GO_MOD_KEY=$KEY"
          echo "AO_GO_MOD_PATH=$HOME/go/pkg/mod"
          echo "AO_GO_MOD_HIT=$HIT"
        } >> "$GITHUB_ENV"

    # The build cache holds compiled packages and passed test results, so a
    # warm job rebuilds and retests only what a change touched. Its path
    # differs per OS (Library/Caches on macOS). A slot's key ends in the
    # commit; a job restores the newest main entry of its slot.
    - name: Locate the Go build cache
      if: inputs.go == 'true'
      id: go-cache
      shell: bash
      env:
        KEY: go-build-${{ inputs.cache-name }}-${{ runner.os }}-${{ github.sha }}
      run: |
        go version
        path=$(go env GOCACHE)
        echo "path=$path" >> "$GITHUB_OUTPUT"
        {
          echo "AO_GO_CACHE_KEY=$KEY"
          echo "AO_GO_CACHE_PATH=$path"
        } >> "$GITHUB_ENV"

    - name: Restore the Go build cache
      if: inputs.go == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.go-cache.outputs.path }}
        key: go-build-${{ inputs.cache-name }}-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          go-build-${{ inputs.cache-name }}-${{ runner.os }}-

    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      if: inputs.node == 'true' && steps.image.outputs.baked != 'true'

    # setup-node's own pnpm cache saves on every event, so the store is
    # cached here under the one rule instead.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      if: inputs.node == 'true' && steps.image.outputs.baked != 'true'
      with:
        node-version-file: frontend/package.json

    - name: Locate the pnpm store
      if: inputs.node == 'true' && steps.image.outputs.baked != 'true'
      id: pnpm-store
      shell: bash
      env:
        KEY: pnpm-store-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml', 'e2e/pnpm-lock.yaml') }}
      run: |
        path=$(pnpm --dir frontend store path)
        echo "path=$path" >> "$GITHUB_OUTPUT"
        {
          echo "AO_PNPM_STORE_KEY=$KEY"
          echo "AO_PNPM_STORE_PATH=$path"
        } >> "$GITHUB_ENV"

    - name: Restore the pnpm store
      if: inputs.node == 'true' && steps.image.outputs.baked != 'true'
      id: pnpm-restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml', 'e2e/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-

    - name: Record the pnpm store
      if: inputs.node == 'true' && steps.image.outputs.baked != 'true'
      shell: bash
      env:
        HIT: ${{ steps.pnpm-restore.outputs.cache-hit }}
      run: echo "AO_PNPM_STORE_HIT=$HIT" >> "$GITHUB_ENV"

    # A push saves only the build cache entries the job used
    # (scripts/ci-go-cache.mjs): restored entries are set two hours back
    # here, and the save deletes the ones Go did not refresh.
    - name: Age the restored Go build cache
      if: inputs.go == 'true' && github.event_name == 'push'
      shell: bash
      env:
        CACHE: ${{ steps.go-cache.outputs.path }}
      run: |
        mkdir -p "$CACHE"
        node scripts/ci-go-cache.mjs backdate "$CACHE" "$RUNNER_TEMP/go-cache-state.json"

    # pnpm switches itself to the packageManager pin, so a bumped pin still
    # installs in the image; the baked store answers what the lockfile
    # names and the registry supplies the rest.
    - name: Install frontend dependencies
      if: inputs.frontend-deps == 'true' || inputs.frontend-dist == 'true'
      shell: bash
      run: pnpm --dir frontend install --frozen-lockfile

    - name: Build the frontend bundle
      if: inputs.frontend-dist == 'true'
      shell: bash
      run: pnpm --dir frontend run build

    - name: Install e2e dependencies
      if: inputs.e2e-deps == 'true'
      shell: bash
      run: pnpm --dir e2e install --frozen-lockfile

    - name: Provide Playwright browsers
      if: inputs.browsers != ''
      shell: bash
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        set -euo pipefail
        # The frontend and e2e lockfiles pin the same Playwright; the e2e
        # package owns the CLI here. The suites run headless without a
        # channel, so Chromium is the headless shell only, as in the image.
        # `install` is a no-op for a browser build that is already present
        # and downloads a missing one, after which the OS libraries that
        # build needs are installed too. Only the Linux jobs ask for
        # browsers, and the image carries them at its pin.
        dir=e2e
        if [[ ! -d e2e/node_modules ]]; then dir=frontend; fi
        root=${PLAYWRIGHT_BROWSERS_PATH:-$HOME/.cache/ms-playwright}
        before=$(ls -1 "$root" 2>/dev/null | sort || true)
        # shellcheck disable=SC2086
        pnpm --dir "$dir" exec playwright install --only-shell $BROWSERS
        after=$(ls -1 "$root" | sort)
        if [[ "$before" != "$after" ]]; then
          # shellcheck disable=SC2086
          pnpm --dir "$dir" exec playwright install-deps $BROWSERS
        fi

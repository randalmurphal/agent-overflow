<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Choose WSL Distro - Agent Overflow</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #16161e;
        --fg: #ffffff;
        --muted: #8b8ba0;
        --accent: #7aa2f7;
        --accent-hover: #9ab8ff;
        --border: rgba(255, 255, 255, 0.08);
        --row-bg: rgba(255, 255, 255, 0.03);
        --row-bg-hover: rgba(122, 162, 247, 0.12);
        --error: #f7768e;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
      }

      body {
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 32px 24px;
      }

      .container {
        width: 100%;
        max-width: 480px;
      }

      h1 {
        font-size: 18px;
        font-weight: 600;
        margin: 0 0 8px;
      }

      p.subtitle {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 13px;
      }

      .distro-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .distro-row {
        background: var(--row-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        transition: background 80ms ease, border-color 80ms ease;
        font-family: inherit;
        font-size: 14px;
        color: inherit;
        width: 100%;
        text-align: left;
      }

      .distro-row:hover {
        background: var(--row-bg-hover);
        border-color: rgba(122, 162, 247, 0.3);
      }

      .distro-row:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      .distro-row[disabled] {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .distro-meta {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .distro-name {
        font-weight: 500;
      }

      .distro-detail {
        font-size: 12px;
        color: var(--muted);
      }

      .badge {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 999px;
        background: rgba(122, 162, 247, 0.18);
        color: var(--accent-hover);
      }

      .empty-state {
        background: var(--row-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 24px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }

      .empty-state strong {
        color: var(--fg);
        display: block;
        margin-bottom: 8px;
      }

      .empty-state code {
        background: rgba(255, 255, 255, 0.06);
        padding: 1px 6px;
        border-radius: 4px;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 12px;
      }

      .error {
        color: var(--error);
        font-size: 13px;
        margin-top: 12px;
      }

      .loading {
        display: none;
        align-items: center;
        gap: 12px;
        margin-top: 24px;
        font-size: 13px;
        color: var(--muted);
      }

      .loading[data-active="1"] {
        display: flex;
      }

      .loading::before {
        content: "";
        display: block;
        width: 14px;
        height: 14px;
        border: 2px solid var(--accent);
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 800ms linear infinite;
      }

      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
    <!--
      The Wails app server hosts its JS bridge at /wails/runtime.js;
      without it window.wails is undefined and pick() can't reach the
      bound PickDistro method. Loaded ahead of the inline script below
      so the bridge is ready by the time the user clicks a row.
    -->
    <script src="/wails/runtime.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>Choose a WSL distro</h1>
      <p class="subtitle">
        Agent Overflow runs its backend inside a WSL distribution. Pick the one
        you want it to use. You can change this later from settings.
      </p>
      <div id="distros" class="distro-list"></div>
      <div id="loading" class="loading">Booting backend in WSL... this can take a few seconds on first launch.</div>
      <div id="error" class="error" hidden></div>
    </div>

    <script>
      // The Windows launcher injects the distro list as JSON via the
      // global __AO_DISTROS__ variable rendered into the page just
      // before this script runs. Falling back to an empty list keeps
      // the page renderable for offline development.
      const distros = window.__AO_DISTROS__ || [];
      const root = document.getElementById("distros");
      const errEl = document.getElementById("error");

      function showError(msg) {
        errEl.textContent = msg;
        errEl.hidden = false;
      }

      function pick(name) {
        // The Wails v3 runtime exposes call-by-FQN as
        // wails.Call.ByName('<pkgPath>.<Type>.<Method>', ...args). The
        // FQN itself is rendered in by picker.go via reflect so we don't
        // hard-code the package/type names here.
        const callByName =
          window.wails && window.wails.Call && window.wails.Call.ByName;
        const fqn = window.__AO_PICK_DISTRO_FQN__;
        if (typeof callByName !== "function" || !fqn) {
          showError("Internal error: Wails bridge unavailable. Reopen the app.");
          return;
        }
        // Hide the picker rows + show the loading spinner so the user
        // doesn't double-click while we install the payload + spawn
        // the WSL backend (can take 5-15 seconds on cold boot).
        document.getElementById("distros").style.display = "none";
        document.getElementById("loading").dataset.active = "1";
        callByName(fqn, name).catch((err) => {
          document.getElementById("loading").dataset.active = "0";
          document.getElementById("distros").style.display = "";
          showError("Picker error: " + (err && err.message ? err.message : err));
        });
      }

      if (!distros.length) {
        root.innerHTML =
          '<div class="empty-state">' +
          "<strong>No WSL distros detected.</strong>" +
          "Install WSL2 and a Linux distribution before launching Agent Overflow. " +
          "Open PowerShell and run <code>wsl --install -d Ubuntu</code>, then reopen this app." +
          "</div>";
      } else {
        for (const d of distros) {
          const btn = document.createElement("button");
          btn.className = "distro-row";
          btn.type = "button";
          if (d.version !== 2) {
            btn.disabled = true;
          }

          const meta = document.createElement("div");
          meta.className = "distro-meta";
          const name = document.createElement("span");
          name.className = "distro-name";
          name.textContent = d.name;
          const detail = document.createElement("span");
          detail.className = "distro-detail";
          const wslVersion = "WSL" + d.version;
          detail.textContent = `${wslVersion} - ${d.state}`;
          meta.appendChild(name);
          meta.appendChild(detail);
          btn.appendChild(meta);

          if (d.default) {
            const badge = document.createElement("span");
            badge.className = "badge";
            badge.textContent = "default";
            btn.appendChild(badge);
          }

          btn.addEventListener("click", () => pick(d.name));
          root.appendChild(btn);
        }
      }
    </script>
  </body>
</html>

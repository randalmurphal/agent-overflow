# yaml-language-server: $schema=../workflow.schema.json
# Required project profile bindings (names must match exactly):
# checks: build-and-test
# commands: merge-unit-branches
# capacities: validation-slot
#
# Also required: the `port-one-task` workflow, in a scope this one resolves
# (`agent-overflow workflow new port-one-task --id port-one-task`). Each
# implement unit CALLS it, so without it every wave refuses at its fan-out.
#
# A campaign is ONE root run. Each wave is this graph; the last phase calls
# THIS workflow again for the next wave, so wave N+1 is a child of wave N and
# the whole campaign is one call tree in one worktree on one branch. Nothing
# chains it from outside - no automation, no cron, no second orchestration
# engine. See docs/architecture/workflow-campaigns.md.
#
# Fable plans, GPT works. The planner is Claude because deciding what the
# campaign does next is the judgment call; the task lanes are Codex, and the
# lane's own review phase is where a Claude lens looks at the result.
#
# Two things end a campaign, and neither is a wave count:
#   - the planner reports `complete`, and this run finishes WITHOUT taking the
#     self-call, which unwinds the whole tree wave by wave;
#   - a human stops it - `agent-overflow run soft-stop <root-run-id>` parks the
#     tree at its next call boundary (D36), and `checkpoint-every` below parks
#     it on a schedule.
#
# The merge join is bound to `merge-unit-branches`, and a reference
# implementation is scaffolded beside this definition as
# `<id>-merge-unit-branches.py` (where `<id>` is what you passed to
# `workflow new --id`). Bind that name in the project profile's command map to
# the argv ["python3", "<abs path to the scaffolded script>", "{{units}}"].
#
# The units reach it as one JSON argv element with id, status, branch, and
# worktree per entry. It merges the lane branches ONE AT A TIME and a lane that
# conflicts is aborted, skipped, and REPORTED - it never stops the lanes behind
# it. The join declares `accounts_for_units: true`, so the engine refuses a done
# envelope unless every unit appears exactly once across outputs.merged and
# outputs.blocked: a lane can no longer be silently lost by a merge that gave up
# early. A unit a human DROPPED is one of those units and is accounted for in
# outputs.blocked with a reason naming the drop. The script exits non-zero when
# a human still has to land something - a conflict, not a drop - which the gate
# reads through the tool driver's own `passed` output.
#
# Disposition is MANUAL. The campaign branch is the deliverable and it stays
# where a human can read it; nothing here merges to a base branch on its own.
id: port-campaign
name: Port campaign
description: Run a long port campaign as one call tree - a Claude planner schedules each wave against a fixed acceptance-criteria ledger, every task runs as its own child workflow in its own worktree, the wave is merged and verified on the campaign branch, and the final phase calls the next wave.
# What this campaign will not do, carried into every element's prompt for the
# life of the run. Scope growth one reasonable-looking decision at a time is how
# a forty-wave campaign fails, and a boundary each wave re-derives is a boundary
# that moves.
non_goals:
  - Redesigning or refactoring code that is not on a scheduled task's targets. Note it for a future campaign instead.
  - Changing public APIs, wire formats, or database schemas unless a scheduled task's intent says to.
  - Weakening, skipping, or deleting a test to make a wave pass. A failing test is a finding, never an obstacle.
  - Adding dependencies, build steps, or tooling the campaign goal did not ask for.
  - Reformatting, renaming, or restyling files a task does not otherwise change.
inputs:
  campaign-goal:
    schema:
      type: string
      multiline: true
      description: What the campaign is porting, to what, and the standing rules every wave must respect.
  criteria:
    schema:
      type: array
      description: The campaign's acceptance criteria, fixed at the start and never rewritten by a wave. They are what "done" means; the planner reports coverage against them instead of re-forming its own opinion of done every wave.
      items:
        type: object
        properties:
          id:
            type: string
          statement:
            type: string
        required: [id, statement]
        additionalProperties: false
  coverage:
    schema:
      type: array
      description: The previous wave's ledger of where each criterion stood. Written by that wave's planner and forwarded through the self-call; leave it empty when starting a campaign.
      items:
        type: object
        properties:
          id:
            type: string
          state:
            type: string
            enum: [uncovered, covered, satisfied, regressed]
          evidence:
            type: string
          lane:
            type: string
        required: [id, state, evidence, lane]
        additionalProperties: false
    optional: true
  max-tasks:
    schema:
      type: number
      minimum: 1
      description: Upper bound on the tasks one wave schedules. Keep it at or under the project's max_fan_out_width, which refuses a wider expansion rather than truncating it.
  # This is a seed rather than the reserved `call-depth` read on purpose. The
  # engine's read is how deep THIS run sits in THIS call tree, so a campaign
  # picked back up as a fresh root starts again at 0 while its wave numbering
  # continues - which is why the ordinal is content here. Use `{{call-depth}}`
  # when what you want really is the tree depth: the engine supplies it, no
  # declaration exists to get wrong, and nothing downstream can restate it.
  wave-number:
    schema:
      type: number
      minimum: 1
      description: Which wave this run is. Start a campaign at 1; every later wave is handed its number by the wave before it.
  checkpoint-every:
    schema:
      type: number
      minimum: 0
      description: Ask a human to approve continuing every Nth wave. 0 never asks, and a human can still stop the tree at any wave boundary with `agent-overflow run soft-stop`.
  job-notes:
    schema:
      type: string
      multiline: true
      description: Standing instructions for every wave, fixed for the campaign. Steering that has to change mid-campaign belongs in the repo context files the planner reads, or in these prompt files - both are re-read from disk on every wave.
    optional: true
  carried-notes:
    schema:
      type: string
      multiline: true
      description: The previous wave's handoff to this one. Written by that wave's planner, not by a human; leave it empty when starting a campaign.
    optional: true
outputs:
  scheduled:
    from: plan.scheduled
  complete:
    from: plan.complete
  next-wave-number:
    from: plan.next-wave-number
  carry-forward:
    from: plan.carry-forward
  coverage:
    from: plan.coverage
phases:
  - id: plan
    name: Plan this wave
    driver: agent
    provider: claude
    model: claude-fable-5
    prompt: plan.md
    access: read-only
    inputs:
      campaign-goal:
        schema:
          type: string
          multiline: true
      criteria:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              statement:
                type: string
            required: [id, statement]
            additionalProperties: false
      coverage:
        schema:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              state:
                type: string
                enum: [uncovered, covered, satisfied, regressed]
              evidence:
                type: string
              lane:
                type: string
            required: [id, state, evidence, lane]
            additionalProperties: false
        optional: true
      max-tasks:
        schema:
          type: number
          minimum: 1
      wave-number:
        schema:
          type: number
          minimum: 1
      checkpoint-every:
        schema:
          type: number
          minimum: 0
      job-notes:
        schema:
          type: string
          multiline: true
        optional: true
      carried-notes:
        schema:
          type: string
          multiline: true
        optional: true
    outputs:
      tasks:
        schema:
          type: array
          description: The disjoint tasks this wave implements, one fan-out unit each.
          items:
            type: object
            properties:
              id:
                type: string
              title:
                type: string
              intent:
                type: string
              sources:
                type: string
              targets:
                type: string
              acceptance:
                type: string
            required: [id, title, intent, sources, targets, acceptance]
            additionalProperties: false
      scheduled:
        schema:
          type: number
          minimum: 0
          description: Number of entries in tasks. Reported separately so the gate can route on it.
      coverage:
        schema:
          type: array
          description: Where every criterion stands after this wave was planned, one entry per criterion in the criteria input - never a subset. Forwarded to the next wave through the self-call, which is what makes the ledger cumulative without the engine knowing it exists.
          items:
            type: object
            properties:
              id:
                type: string
              state:
                type: string
                enum: [uncovered, covered, satisfied, regressed]
              evidence:
                type: string
              lane:
                type: string
            required: [id, state, evidence, lane]
            additionalProperties: false
      complete:
        schema:
          type: boolean
          description: True only when every criterion is satisfied and nothing is left to schedule. This is the campaign's exit - the run finishes here and never takes the self-call.
      next-wave-number:
        schema:
          type: number
          minimum: 1
          description: This wave's number plus one. Handed to the next wave through the self-call's args.
      checkpoint-due:
        schema:
          type: boolean
          description: Whether a human is asked to approve continuing after this wave.
      carry-forward:
        schema:
          type: string
          multiline: true
          description: What the next wave's planner must know that the repository does not show - deferred work, ordering decisions, standing risks.
    gate:
      routes:
        # The campaign's exit. Nothing calls the next wave, so this run rests
        # done and every wave waiting on it above unwinds the same way.
        - when:
            eq:
              ref: plan.complete
              value: true
          to: done
        # Work is known but none was scheduled: the campaign cannot advance on
        # its own, so it stops here instead of calling empty waves forever.
        - when:
            eq:
              ref: plan.scheduled
              value: 0
          park: campaign-stalled
        - to: implement
  - id: implement
    name: Run every task as its own workflow
    shape: fan-out
    over: plan.tasks
    as: task
    inputs:
      campaign-goal:
        schema:
          type: string
          multiline: true
    # The merge contract (`accounts_for_units:` on the join below). Every unit of
    # the wave appears exactly once across these two lists, and the engine
    # refuses a done join envelope that leaves one out or names one twice - the
    # failure mode being closed is a merge that stopped at its first conflict
    # and reported a clean-looking result while an approved lane's work went
    # nowhere and nothing said so.
    outputs:
      merged:
        schema:
          type: array
          description: Unit ids whose lane branch is now in the campaign branch.
          items:
            type: string
      blocked:
        schema:
          type: array
          description: Units whose work is not in the campaign branch, each with the reason. A conflicting lane is aborted, skipped, and listed here; it never stops the lanes behind it and it is never left unmentioned. A unit a human dropped is listed here too, with a reason saying so - it is accounted for, not repaired.
          items:
            type: object
            properties:
              unit:
                type: string
              reason:
                type: string
            required: [unit, reason]
            additionalProperties: false
    # One unit per planned task, and each unit is a whole `port-one-task` run in
    # the unit's own sub-worktree. The lane owns implement, review and fix for
    # its task; this phase owns only isolation and the merge.
    unit:
      id: port
      call: port-one-task
      args:
        campaign-goal: campaign-goal
        task-id: task.id
        task-title: task.title
        task-intent: task.intent
        task-sources: task.sources
        task-targets: task.targets
        task-acceptance: task.acceptance
    join:
      id: merge
      command: merge-unit-branches
      access: write
      accounts_for_units: true
    gate:
      routes:
        # passed comes from the tool driver and is never declared above. The
        # script exits non-zero exactly when it blocked something, so this is
        # "every lane landed" without a second way of saying it.
        - when:
            eq:
              ref: implement.passed
              value: true
          to: verify
        - to: resolve-conflicts
  - id: resolve-conflicts
    name: Land the lanes the merge could not take
    driver: agent
    provider: codex
    model: gpt-5.6-sol
    prompt: resolve-conflicts.md
    access: write
    inputs:
      campaign-goal:
        schema:
          type: string
          multiline: true
      implement.blocked:
        schema:
          type: array
          items:
            type: object
            properties:
              unit:
                type: string
              reason:
                type: string
            required: [unit, reason]
            additionalProperties: false
    outputs:
      resolved:
        schema:
          type: boolean
      summary:
        schema:
          type: string
          multiline: true
    gate:
      routes:
        - when:
            eq:
              ref: resolve-conflicts.resolved
              value: true
          to: verify
        - park: merge-unresolved
  - id: verify
    name: Verify the merged campaign branch
    driver: tool
    check: build-and-test
    resources: [validation-slot]
    outputs:
      details:
        schema:
          type: string
          multiline: true
        optional: true
    gate:
      routes:
        # Every task was reviewed on its own branch; what fails here is what only
        # exists once they are together, so an integration fix is its own phase.
        - when:
            eq:
              ref: verify.passed
              value: false
          to: integration-fix
        # The scheduled checkpoint. Approve continues into the next wave; reject
        # carries the human's note back into a fresh plan for this wave instead,
        # which is the only other thing a run can do at its own call boundary.
        - when:
            eq:
              ref: plan.checkpoint-due
              value: true
          human:
            approve: next-wave
            reject:
              loop: plan
              max: 2
              feedback: [verify.details]
        - to: next-wave
  - id: integration-fix
    name: Fix what only breaks once the wave is merged
    driver: agent
    provider: codex
    model: gpt-5.6-sol
    prompt: integration-fix.md
    access: write
    inputs:
      campaign-goal:
        schema:
          type: string
          multiline: true
      verify.details:
        schema:
          type: string
          multiline: true
        optional: true
    outputs:
      summary:
        schema:
          type: string
          multiline: true
      changed:
        schema:
          type: boolean
    gate:
      routes:
        - loop: verify
          max: 2
          feedback: [integration-fix.summary]
        - park: wave-verification-failed
  - id: next-wave
    name: Call the next wave
    shape: call
    call: port-campaign
    # The campaign's wave ceiling. Each wave is one more level of the call tree,
    # and the engine refuses past its own absolute depth of 256 - so this stays
    # comfortably under it, with room for each wave's task lanes below.
    max_depth: 200
    args:
      campaign-goal: campaign-goal
      # The criteria are the campaign's fixed definition of done and are handed
      # on unchanged; the coverage ledger is this wave's answer against them.
      # Both ride the ordinary self-call args, exactly as wave-number does - the
      # ledger is CONTENT, and the engine has no idea it exists.
      criteria: criteria
      coverage: plan.coverage
      max-tasks: max-tasks
      wave-number: plan.next-wave-number
      checkpoint-every: checkpoint-every
      job-notes: job-notes
      carried-notes: plan.carry-forward
    gate:
      routes:
        - to: done
cleanup: manual

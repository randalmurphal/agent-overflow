<!doctype html>
<!-- Reference mockup for docs/specs/issues.md. A static page with sample data, not app code.
     Where it differs from the spec, the spec is right. A window 640px wide or narrower shows the compact layout. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Issues · board</title>
<style>
  :root {
    color-scheme: dark;
    --s0: oklch(0.145 0.014 285.82); --s1: oklch(0.178 0.014 285.82); --s2: oklch(0.215 0.014 285.82); --s3: oklch(0.26 0.014 285.82);
    --line: oklch(0.27 0.014 285.82); --line2: oklch(0.36 0.014 285.82);
    --fg: oklch(0.96 0.006 285.82); --fg2: oklch(0.72 0.006 285.82); --fg3: oklch(0.54 0.008 285.82);
    --accent: oklch(0.62 0.19 276); --accent-2: oklch(0.72 0.14 276);
    --ok: oklch(0.72 0.16 150); --warn: oklch(0.78 0.14 80); --bad: oklch(0.68 0.19 25); --info: oklch(0.68 0.15 245);
    --mono: 'Geist Mono', ui-monospace, SFMono-Regular, Consolas, Menlo, monospace;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--s0); color: var(--fg); font: 13.5px/1.45 'Geist Sans', ui-sans-serif, system-ui, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg.i { width: 14px; height: 14px; flex: none; }

  /* frame */
  .app { display: grid; grid-template-columns: 208px 1fr; height: 100vh; }
  .side { background: var(--s1); border-right: 1px solid var(--line); display: flex; flex-direction: column; color: var(--fg2); font-size: 13px; }
  .side h6 { margin: 0; padding: 12px 12px 4px; font-size: 11px; font-weight: 400; letter-spacing: .04em; text-transform: uppercase; color: var(--fg3); }
  .side .t { padding: 5px 12px 5px 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side .grow { flex: 1; }
  .side .tools { border-top: 1px solid var(--line); padding: 8px; display: flex; gap: 4px; }
  .side .tools span { height: 28px; padding: 0 8px; border-radius: 6px; display: inline-flex; align-items: center; }
  .side .tools .on { background: var(--s2); color: var(--fg); }
  .side .set { padding: 8px 14px 12px; }
  .pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }
  .head { display: flex; align-items: center; gap: 10px; padding: 10px 22px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .head b { font-weight: 600; margin-right: 4px; }
  .ctl { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 11px; border-radius: 7px; background: var(--s1); border: 1px solid var(--line); color: var(--fg2); transition: background .15s, border-color .15s, color .15s; }
  .ctl:hover { background: var(--s2); border-color: var(--line2); color: var(--fg); }
  .ctl.primary { background: var(--accent); border-color: transparent; color: #fff; font-weight: 500; }
  .tabs { display: flex; gap: 2px; margin-left: 6px; }
  .tabs span { padding: 4px 10px; border-radius: 7px; color: var(--fg3); transition: background .15s, color .15s; }
  .tabs span:hover { color: var(--fg); }
  .tabs .on { background: var(--s2); color: var(--fg); }
  .head .r { margin-left: auto; display: flex; gap: 8px; }
  .head { container: head / inline-size; } .tabs span svg { display: none; width: 12px; height: 12px; margin-left: 5px; vertical-align: -1px; }
  @container head (max-width: 890px) { .head .r .lb, .head .r kbd { display: none; } .head .r .ctl { padding: 0; width: 28px; min-width: 0; justify-content: center; } }
  @container head (max-width: 590px) { #paneTitle { display: none; } }
  @container head (max-width: 546px) { .tabs span:not(.on) { display: none; } .tabs .on { cursor: pointer; } .tabs .on svg { display: inline; } }
  .find { min-width: 170px; justify-content: flex-start; } .find kbd { margin-left: auto; font: 11px var(--mono); color: var(--fg3); }
  .body { flex: 1; overflow: auto; padding: 22px 22px 110px; }

  /* sprint strip */
  .sprint { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  .sprint h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .sprint .left { color: var(--fg3); }
  .sprint .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--s2); overflow: hidden; }
  .sprint .bar i { display: block; height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .7s var(--ease); }
  .sprint .num { color: var(--fg2); font-variant-numeric: tabular-nums; } .sprint .num b { color: var(--fg); font-weight: 600; }

  /* shared ticket pieces */
  .k { font: 11.5px var(--mono); color: var(--fg3); }
  .pts { min-width: 22px; height: 20px; padding: 0 6px; border-radius: 6px; background: var(--s3); font: 600 11.5px/20px var(--mono); text-align: center; color: var(--fg); }
  .av { width: 22px; height: 22px; border-radius: 50%; font: 600 10.5px/22px system-ui; text-align: center; color: #fff; flex: none; }
  .av.me { box-shadow: 0 0 0 2px var(--s1), 0 0 0 3.5px var(--accent); }
  .fl { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg3); }
  .fl.bad { color: var(--bad); } .fl.ok { color: var(--ok); }
  .nm { color: var(--fg2); }
  .lane > header { display: flex; align-items: center; gap: 8px; }
  .lane > header b { font-weight: 600; }
  .lane > header .cnt { color: var(--fg3); font-variant-numeric: tabular-nums; }
  .lane > header .cnt em { font-style: normal; color: var(--accent-2); }
  .card { cursor: grab; transition: transform .18s var(--ease), box-shadow .18s var(--ease), border-color .15s, background .15s; }
  .card.settle { animation: settle .45s var(--ease); }
  @keyframes settle { 0% { transform: scale(1.04); box-shadow: 0 0 0 2px var(--accent); } 100% { transform: none; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .board { animation: rise .35s var(--ease); }

  /* ---------- A: Sharp ---------- */
  [data-v="a"] .board { display: grid; grid-template-columns: repeat(4, minmax(232px, 1fr)); gap: 18px; align-items: start; }
  #main { overflow-x: auto; }
  [data-v="a"] .lane { border-radius: 10px; padding: 4px; transition: background .15s; }
  [data-v="a"] .lane.over { background: oklch(0.62 0.19 276 / 8%); }
  [data-v="a"] .lane > header { padding: 4px 6px 10px; }
  [data-v="a"] .card { background: var(--s1); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 6px; display: flex; flex-direction: column; gap: 7px; }
  [data-v="a"] .card:hover { border-color: var(--line2); background: var(--s2); }
  .card .ct { line-height: 1.4; }
  .cmeta { display: flex; align-items: center; gap: 8px; } .cmeta .sp { flex: 1; }
  .epic { align-self: flex-start; max-width: 100%; font-size: 11.5px; font-weight: 500; line-height: 18px; padding: 0 7px; border-radius: 5px; background: oklch(0.5 0.1 var(--h) / 26%); color: oklch(0.85 0.09 var(--h)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lbs { display: flex; gap: 5px; flex-wrap: wrap; } .lb { font-size: 11.5px; line-height: 18px; padding: 0 6px; border-radius: 5px; background: var(--s3); color: var(--fg2); }
  .hide-ty :is(.card, .brow) .ty, .hide-epic :is(.card, .brow) .epic, .hide-pri :is(.card, .brow) .pri, .hide-lb :is(.card, .brow) .lbs, .hide-p :is(.card, .brow) .pts, .hide-who :is(.card, .brow) .av, .hide-k :is(.card, .brow) .k { display: none; }
  .card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .av.none { background: none; border: 1.5px dashed var(--line2); }
  .tabs span[data-view] { cursor: pointer; }
  /* backlog: one list per sprint */
  .bsec { margin-bottom: 22px; }
  .bsec > header { display: flex; align-items: center; gap: 10px; padding: 0 6px 8px 0; min-height: 34px; } .bsec > header b { font-weight: 600; } .bsec > header span { color: var(--fg3); }
  .bsec > header .r { color: var(--fg2); font-variant-numeric: tabular-nums; white-space: nowrap; } .bsec > header .sp { flex: 1; }
  .bsec > header .r em { font-style: normal; color: var(--accent-2); } .bsec > header .r .warn { color: var(--warn); }
  .bsec > header .note { min-width: 0; flex-shrink: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .bsec .sech { white-space: nowrap; flex: none; } .bsec > header .r { flex: none; }
  .bsec .sech { font-size: 13.5px; color: var(--fg); } .bsec .sech b { font-weight: 600; } .bsec.shut { margin-bottom: 10px; }
  .bsec.over .blist { border-color: var(--accent); }
  /* sprint planning: how full the sprint is against your usual pace, and who carries what */
  .cap { height: 3px; border-radius: 2px; background: var(--s2); margin: 0 0 10px; overflow: hidden; } .cap i { display: block; height: 100%; background: var(--accent); border-radius: 2px; transition: width .25s var(--ease), background .2s; } .cap.over i { background: var(--warn); }
  .load { display: flex; gap: 6px; } .lc { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px 0 3px; border-radius: 12px; background: var(--s1); border: 1px solid var(--line); font-size: 12px; color: var(--fg2); font-variant-numeric: tabular-nums; }
  .lc .av { width: 18px; height: 18px; line-height: 18px; font-size: 9.5px; box-shadow: none; }
  .docked.open .load { display: none; }
  .blist.empty { display: grid; place-items: center; min-height: 44px; color: var(--fg3); border-style: dashed; background: none; }
  .newt { display: flex; align-items: center; gap: 8px; margin: 6px 0 0 4px; padding: 5px 8px; border-radius: 6px; color: var(--fg3); font-size: 12.5px; } .newt:hover { background: var(--s2); color: var(--fg); }
  .newin { margin: 6px 0 0; width: 100%; height: 36px; background: var(--s1); border: 1px solid var(--accent); border-radius: 8px; padding: 0 12px; color: var(--fg); font: inherit; outline: none; }
  .brow { touch-action: none; user-select: none; -webkit-user-select: none; }
  .ed { display: inline-grid; place-items: center; padding: 3px; margin: -3px; border-radius: 6px; } .ed:hover { background: var(--s3); box-shadow: 0 0 0 1px var(--line2); }
  :is(.brow, .card) button.pts { cursor: pointer; } :is(.brow, .card) button.pts.none { color: var(--warn); background: none; box-shadow: inset 0 0 0 1px var(--line2); }
  .avb { display: grid; border-radius: 50%; } :is(.brow, .card) button.pts:hover, .avb:hover { box-shadow: 0 0 0 2px var(--accent); }
  .hide-ty .e-ty, .hide-pri .e-pri, .hide-who :is(.card, .brow) .avb { display: none; }
  .brow.held { position: fixed; z-index: 20; pointer-events: none; will-change: transform; transition: none; background: var(--s2); border: 1px solid var(--line2); border-radius: 8px; box-shadow: 0 18px 40px oklch(0 0 0 / 55%), 0 2px 6px oklch(0 0 0 / 40%); }
  .slot.row { margin: 0; border-radius: 0; border-left: 0; border-right: 0; box-sizing: border-box; overflow: hidden; transition: height .16s var(--ease); } .slot.ghost { border-color: transparent; background: none; }
  .pop .frm { display: grid; grid-template-columns: 56px 1fr; gap: 8px 10px; align-items: center; padding: 4px 8px 10px; color: var(--fg3); font-size: 12.5px; width: 300px; }
  .pop .frm input { background: var(--s1); border: 1px solid var(--line); border-radius: 7px; height: 30px; padding: 0 10px; color: var(--fg); font: inherit; outline: none; min-width: 0; width: 100%; } .pop .frm input:focus { border-color: var(--accent); } .pop .frm .two { display: flex; gap: 8px; align-items: center; }
  .blist { border: 1px solid var(--line); border-radius: 10px; background: var(--s1); overflow: hidden; }
  .brow { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 12px; cursor: pointer; transition: background .12s; } .brow + .brow { border-top: 1px solid var(--line); } .brow:hover { background: var(--s2); }
  .brow .ct { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .brow .k { width: 62px; flex: none; } .brow .lbs { flex-wrap: nowrap; } .brow .epic { align-self: center; flex: none; }
  .brow.sel { background: oklch(0.62 0.19 276 / 13%); box-shadow: inset 2px 0 0 var(--accent); }
  .docked.open .brow :is(.lbs, .epic) { display: none; }

  /* ---------- the row above the board: one line of numbers, or full tiles ---------- */
  .strip { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 16px; }
  .stripMain { flex: 1; min-width: 0; }
  .stripCtl { display: flex; flex-direction: column; gap: 6px; }
  .ib { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; color: var(--fg3); border: 1px solid transparent; transition: background .15s, color .15s, border-color .15s; }
  .ib:hover { background: var(--s2); color: var(--fg); border-color: var(--line); }
  .ib.on { background: var(--accent); color: #fff; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 11px 0 9px; border-radius: 7px; background: var(--s1); border: 1px solid var(--line); color: var(--fg2); position: relative; transition: background .15s, border-color .15s, color .15s; font-variant-numeric: tabular-nums; }
  .chip b { color: var(--fg); font-weight: 600; margin-right: -3px; }
  .chip .sep { color: var(--fg3); }
  .chip:hover { background: var(--s2); border-color: var(--line2); color: var(--fg); }
  .chip svg.mini { width: 16px; height: 16px; flex: none; }
  .chip .av { width: 18px; height: 18px; line-height: 18px; font-size: 9.5px; box-shadow: none; }
  .chip .dot { position: absolute; top: -3px; right: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent-2); box-shadow: 0 0 0 2px var(--s0); }
  .chip.on, .tile.on, .ctl.on { border-color: var(--accent); background: oklch(0.62 0.19 276 / 13%); color: var(--fg); }
  .bento { display: flex; gap: 12px; }
  .anim .chips, .anim .bento { animation: rise .3s var(--ease); }
  .tile { flex: 1 1 0; min-width: 0; position: relative; background: var(--s1); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; transition: background .15s, border-color .15s; }
  .tile.w2 { flex-grow: 1.7; }
  .tile.can { cursor: pointer; } .tile.can:hover { border-color: var(--line2); background: var(--s2); }
  .tile h3 { margin: 0 0 12px; font-size: 12px; font-weight: 500; color: var(--fg3); display: flex; align-items: center; gap: 6px; }
  .tile h3 svg { width: 12px; height: 12px; color: var(--accent-2); }
  .ringrow { display: flex; align-items: center; gap: 16px; }
  .ring circle { fill: none; stroke-width: 6; } .ring .bg { stroke: var(--s3); } .ring .fg { stroke: var(--accent); stroke-linecap: round; }
  .big small { white-space: nowrap; }
  .big { font-size: 26px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; } .big small { font-size: 13.5px; font-weight: 400; color: var(--fg2); letter-spacing: 0; }
  .sub { color: var(--fg3); margin-top: 3px; }
  .need { display: flex; align-items: center; gap: 10px; padding: 6px 0; } .need:first-of-type { padding-top: 0; }
  .need .ct { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .barsrow { display: flex; align-items: flex-end; gap: 14px; }
  /* choosing what shows in the row */
  .tile .rm { position: absolute; top: -9px; right: -9px; width: 22px; height: 22px; border-radius: 50%; background: var(--s3); border: 1px solid var(--line2); display: none; place-items: center; color: var(--fg2); }
  .tile .rm:hover { background: var(--bad); border-color: transparent; color: #fff; } .tile .rm svg { width: 11px; height: 11px; }
  .editing .tile { border-style: dashed; cursor: default; } .editing .tile .rm { display: grid; }
  .tile.add { flex: 0 0 132px; display: none; place-items: center; align-content: center; gap: 6px; color: var(--fg3); cursor: pointer; }
  .editing .tile.add { display: grid; } .tile.add:hover { color: var(--fg); border-color: var(--accent); }
  .menu { position: absolute; z-index: 15; top: calc(100% + 8px); right: 0; width: 330px; background: var(--s2); border: 1px solid var(--line2); border-radius: 12px; box-shadow: 0 18px 44px oklch(0 0 0 / 55%); padding: 8px; cursor: default; color: var(--fg); animation: rise .2s var(--ease); }
  .menu h5 { margin: 6px 8px 4px; font-size: 11.5px; font-weight: 500; color: var(--fg3); }
  .menu .opt { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border-radius: 8px; text-align: left; color: var(--fg2); }
  .menu .opt:hover { background: var(--s3); color: var(--fg); } .menu .opt small { margin-left: auto; color: var(--fg3); font-size: 12px; }
  .menu .ask { display: flex; gap: 8px; padding: 4px 8px 8px; }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 8px 0; }
  .menu input { flex: 1; min-width: 0; background: var(--s1); border: 1px solid var(--line); border-radius: 7px; height: 30px; padding: 0 10px; color: var(--fg); font: inherit; outline: none; } .menu input:focus { border-color: var(--accent); }
  .filterbar { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; }
  .filterbar:empty { display: none; }
  .fchip { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 4px 0 10px; border-radius: 7px; border: 1px solid var(--accent); background: oklch(0.62 0.19 276 / 13%); color: var(--fg2); animation: rise .25s var(--ease); }
  .fchip b { color: var(--fg); font-weight: 600; } .fchip button { width: 22px; height: 22px; border-radius: 5px; display: grid; place-items: center; color: var(--fg2); } .fchip button:hover { background: var(--accent); color: #fff; }
  .lane .cards { min-height: 44px; }
  .sprint { display: none; }

  /* ---------- drag: the card hangs from the pointer and swings ---------- */
  .card { touch-action: none; user-select: none; -webkit-user-select: none; position: relative; }
  .grip { position: absolute; left: 50%; top: -5px; width: 64px; height: 18px; margin-left: -32px; display: grid; place-items: center; cursor: grab; opacity: 0; transition: opacity .15s; }
  .grip::before { content: ''; width: 28px; height: 4px; border-radius: 2px; background: var(--fg3); transition: width .15s var(--ease), background .15s; }
  .card:hover .grip { opacity: 1; }
  .grip:hover::before { width: 40px; background: var(--accent); }
  .card.held .grip { opacity: 0; }
  .card.held { position: fixed; z-index: 20; margin: 0; pointer-events: none; cursor: grabbing; will-change: transform; transition: none; border-color: var(--line2); background: var(--s2); box-shadow: 0 18px 40px oklch(0 0 0 / 55%), 0 2px 6px oklch(0 0 0 / 40%); }
  .slot { border: 1px dashed oklch(0.62 0.19 276 / 55%); background: oklch(0.62 0.19 276 / 7%); border-radius: 8px; margin-bottom: 6px; }
  body.dragging, body.dragging * { cursor: grabbing !important; }

  /* ---------- ticket view ----------
     Wide: content on the left, a side section on the right. Narrow: one column, side section under the title.
     It opens over the board, or docked beside it when the pane has room. */
  .scrim { position: absolute; inset: 0; background: oklch(0 0 0 / 35%); opacity: 0; pointer-events: none; transition: opacity .25s; }
  .pane { --tw: 50%; }
  /* the divider between the list and a docked ticket: drag to resize, double-click for half and half */
  .rsz { position: absolute; z-index: 6; top: 0; bottom: 0; right: calc(var(--tw) - 4px); width: 9px; cursor: col-resize; touch-action: none; display: none; } .docked.open .rsz { display: block; }
  .rsz::after { content: ''; position: absolute; top: 0; bottom: 0; left: 3px; width: 3px; background: transparent; transition: background .15s; } .rsz:hover::after, .resizing .rsz::after { background: var(--accent); }
  .resizing .body, .resizing .peek { transition: none; } .resizing, .resizing * { cursor: col-resize !important; user-select: none; -webkit-user-select: none; }
  .body { transition: margin-right .32s var(--ease); }
  .peek { position: absolute; top: 0; right: 0; bottom: 0; width: min(940px, 96%); background: var(--s1); border-left: 1px solid var(--line); box-shadow: -24px 0 60px oklch(0 0 0 / 45%); transform: translateX(104%); transition: transform .32s var(--ease); overflow: hidden; }
  .open .peek { transform: none; } .open .scrim { opacity: 1; pointer-events: auto; }
  .docked .peek { width: var(--tw); box-shadow: none; } .docked .scrim { display: none; } .docked.open .body { margin-right: var(--tw); }
  .pane:not(.canDock) .dockb { display: none; }
  .tk { display: grid; height: 100%; grid-template-columns: minmax(0, 1fr) 304px; grid-template-rows: auto minmax(0, 1fr); }
  .thead { grid-column: 1; grid-row: 1; padding: 16px 28px 0; min-width: 0; }
  .tbody { grid-column: 1; grid-row: 2; padding: 0 28px; overflow: auto; min-width: 0; }
  .rail { grid-column: 2; grid-row: 1 / 3; border-left: 1px solid var(--line); background: var(--s0); padding: 14px 10px 40px; overflow: auto; }
  .tk.nar { display: block; overflow: auto; } .nar .tbody { overflow: visible; padding: 18px 20px 0; } .nar .thead { padding: 14px 20px 0; }

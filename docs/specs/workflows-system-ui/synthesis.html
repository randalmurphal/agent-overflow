<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synthesis — Workflows UI</title>
<style>
/* ============================================================
   Agent Overflow tokens (mirrored from frontend/src/app.css +
   src/styles/tokens.css — dark lens only).
   ============================================================ */
:root {
  --surface-0: oklch(0.145 0.014 285.82);
  --surface-1: oklch(0.178 0.014 285.82);
  --surface-2: oklch(0.215 0.014 285.82);
  --code-inline-bg: oklch(0.275 0.014 285.82);
  --border: oklch(0.3 0.014 285.82);
  --border-strong: oklch(0.52 0.014 285.82);
  --text-primary: oklch(0.95 0.006 285.82);
  --text-secondary: oklch(0.7 0.006 285.82);
  --accent: oklch(0.58 0.19 276);
  --info: oklch(0.62 0.17 250);
  --success: oklch(0.7 0.17 150);
  --error: oklch(0.63 0.2 25);
  --warning: oklch(0.75 0.15 75);
  --overlay: oklch(0 0 0 / 60%);

  --fg: var(--text-primary);
  --fg-muted: color-mix(in oklab, var(--text-primary) 80%, transparent);
  --fg-subtle: color-mix(in oklab, var(--text-primary) 55%, transparent);
  --fg-hint: color-mix(in oklab, var(--text-primary) 30%, transparent);
  --border-subtle: color-mix(in oklab, var(--border) 55%, transparent);
  --card: var(--surface-1);

  --text-micro: 0.6875rem;
  --text-xs: 0.75rem;
  --text-sm: 0.8125rem;
  --text-base: 0.875rem;

  --radius-field: 6px;
  --radius-control: 10px;
  --radius-card: 16px;
  --radius-composer: 20px;

  --shadow-menu: 0 8px 24px -12px color-mix(in oklab, black 40%, transparent);
  --shadow-modal: 0 40px 80px -30px color-mix(in oklab, black 60%, transparent);

  --font-sans: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;

  /* Canonical project identities (brief). */
  --proj-ao: var(--info);
  --proj-m32: oklch(0.72 0.15 55);
  --proj-dsp: var(--success);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--surface-0); color: var(--text-primary);
  font-family: var(--font-sans); font-size: var(--text-sm);
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb {
  background: color-mix(in oklab, var(--border) 78%, transparent);
  border: 2px solid transparent; border-radius: 999px; background-clip: padding-box;
}
::-webkit-scrollbar-track { background: transparent; }
button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: var(--fg); }
kbd {
  font-family: var(--font-mono); font-size: 0.625rem; color: var(--fg-subtle);
  border: 1px solid var(--border-subtle); border-radius: 4px; padding: 0 3px;
  background: var(--surface-2); line-height: 1.4;
}

/* ============================================================
   Mockup chrome: fixed header naming the concept + moment nav.
   ============================================================ */
.topbar {
  position: fixed; inset: 0 0 auto 0; height: 40px; z-index: 100;
  display: flex; align-items: center; gap: 10px; padding: 0 12px;
  background: var(--surface-1); border-bottom: 1px solid var(--border-subtle);
}
.topbar .brand { font-size: var(--text-sm); font-weight: 600; letter-spacing: 0.01em; white-space: nowrap; }
.topbar .brand span { color: var(--fg-hint); font-weight: 400; margin-left: 8px; font-size: var(--text-micro); }
@media (max-width: 1560px) { .topbar .brand span { display: none; } }
.m-tabs { display: flex; gap: 2px; margin-left: 8px; }
.m-tab {
  font-size: var(--text-micro); color: var(--fg-subtle); padding: 3px 8px;
  border-radius: var(--radius-field); white-space: nowrap;
}
.m-tab:hover { color: var(--fg); background: color-mix(in oklab, var(--surface-2) 40%, transparent); }
.m-tab.on { color: var(--fg); background: color-mix(in oklab, var(--accent) 15%, transparent); }
.m-tab .n { color: var(--fg-hint); font-family: var(--font-mono); font-size: 0.625rem; margin-right: 4px; }
.m-desc { margin-left: auto; font-size: var(--text-micro); color: var(--fg-hint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.notes-btn {
  display: flex; align-items: center; gap: 5px; font-size: var(--text-micro);
  color: var(--fg-subtle); padding: 3px 8px; border-radius: var(--radius-field);
  border: 1px solid var(--border-subtle); white-space: nowrap;
}
.notes-btn:hover { color: var(--fg); }
body.notes .notes-btn { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 45%, transparent); }
.i-dot {
  width: 12px; height: 12px; border-radius: 999px; display: inline-flex; align-items: center;
  justify-content: center; font-size: 9px; font-style: italic; font-weight: 700; font-family: Georgia, serif;
  background: color-mix(in oklab, var(--accent) 30%, transparent); color: var(--fg);
}

/* Annotations (hidden unless body.notes). Inline-flow so they never occlude UI. */
.ann { display: none; }
body.notes .ann {
  display: flex; gap: 6px; align-items: flex-start;
  margin: 6px 0; padding: 6px 8px; font-size: var(--text-micro); line-height: 1.5;
  color: var(--fg-subtle); background: color-mix(in oklab, var(--accent) 6%, var(--surface-1));
  border: 1px solid color-mix(in oklab, var(--accent) 25%, transparent); border-radius: var(--radius-field);
}
.ann .i-dot { flex-shrink: 0; margin-top: 1px; }
.ann b { color: var(--fg-muted); font-weight: 600; }

/* ============================================================
   App shell
   ============================================================ */
.shell { position: fixed; inset: 40px 0 0 0; display: flex; }

/* ---------- Sidebar ---------- */
.sidebar {
  width: 250px; flex-shrink: 0; display: flex; flex-direction: column;
  border-right: 1px solid var(--border-subtle);
}
.sb-search { padding: 8px 8px 6px; }
.sb-search .box {
  display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px;
  border: 1px solid var(--border-subtle); border-radius: var(--radius-control);
  color: var(--fg-hint); font-size: var(--text-xs);
}
.sb-head {
  display: flex; align-items: center; padding: 6px 10px 4px;
  font-size: var(--text-micro); font-weight: 500; text-transform: uppercase;
  letter-spacing: 0.18em; color: var(--fg-subtle);
}
.sb-scroll { flex: 1; overflow-y: auto; padding: 0 6px 8px; }
.sb-foot {
  border-top: 1px solid var(--border-subtle); padding: 6px 12px;
  display: flex; align-items: center; gap: 8px; font-size: var(--text-micro); color: var(--fg-subtle);
}

.proj { margin-top: 3px; }
.proj-row {
  display: flex; align-items: center; gap: 6px; padding: 4px 8px;
  border-radius: var(--radius-field); cursor: default;
}
.proj-row:hover { background: color-mix(in oklab, var(--surface-2) 40%, transparent); }
.proj-row .chev { color: var(--fg-subtle); font-size: 9px; transform: rotate(90deg); display: inline-block; width: 10px; }
.proj-row .folder { color: color-mix(in oklab, var(--accent) 80%, transparent); font-size: 11px; }
.proj-row .pname { font-size: 0.78125rem; font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail { margin-left: 8px; padding-left: 0; border-left: 1px solid color-mix(in oklab, var(--border-subtle) 60%, transparent); display: flex; flex-direction: column; gap: 1px; }

/* Normal thread rows — matches ThreadRow.svelte anatomy. */
.trow {
  display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 4px 0 24px;
  border-radius: var(--radius-field); font-size: var(--text-xs); color: var(--fg-muted); cursor: pointer;
  position: relative;
}
.trow:hover { background: color-mix(in oklab, var(--surface-2) 30%, transparent); color: var(--fg); }
.trow.active { background: color-mix(in oklab, var(--accent) 10%, transparent); color: var(--fg); }
.trow .tt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .tm { font-size: 0.625rem; color: var(--fg-hint); font-variant-numeric: tabular-nums; }
.sdot { width: 6px; height: 6px; border-radius: 999px; flex-shrink: 0; }
.slabel { font-size: 0.625rem; font-weight: 500; white-space: nowrap; flex-shrink: 0; }
.s-warn { color: var(--warning); } .s-warn-bg { background: var(--warning); }
.s-err { color: var(--error); } .s-err-bg { background: var(--error); }
.s-ok { color: var(--success); } .s-ok-bg { background: var(--success); }

/* Workflows section head — the whole workflows presence when quiet. */
.wfhead {
  display: flex; align-items: center; gap: 6px; height: 22px; padding: 0 6px 0 10px;
  margin-top: 1px; border-radius: var(--radius-field); cursor: pointer;
  font-size: 0.625rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.14em;
  color: var(--fg-hint);
}
.wfhead:hover { background: color-mix(in oklab, var(--surface-2) 30%, transparent); color: var(--fg-subtle); }
.wfhead .chev { font-size: 8px; width: 8px; display: inline-block; transition: transform 0.12s; color: var(--fg-hint); }
.wfhead.open .chev { transform: rotate(90deg); }
.wfhead .roll { margin-left: auto; display: flex; align-items: center; gap: 5px; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.wfhead .roll .cnt { color: var(--fg-hint); }
.wfhead .roll .need { color: var(--warning); font-weight: 600; }

/* Run rows in the sidebar — same skeleton as thread rows; one signal max. */
.jrow {
  display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 4px 0 14px;
  border-radius: var(--radius-field); font-size: var(--text-xs); color: var(--fg-muted); cursor: pointer;
  position: relative;
}
.jrow:hover { background: color-mix(in oklab, var(--surface-2) 30%, transparent); color: var(--fg); }
.jrow.active { background: color-mix(in oklab, var(--accent) 10%, transparent); color: var(--fg); }
.jrow .jt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.jrow .jm { font-size: 0.625rem; color: var(--fg-hint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.jrow.dim { color: var(--fg-subtle); }

/* Pending-attention glow — AO's existing status-glow-warning, stepped. */
.glow-warn { position: relative; }
.glow-warn::before {
  content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  border: 1px solid var(--warning);
  animation: glowp 2.5s steps(5, jump-none) infinite;
}
@keyframes glowp {
  0%, 100% { box-shadow: 0 0 0 0 transparent; opacity: 0.7; }
  50% { box-shadow: 0 0 0 2px color-mix(in oklab, var(--warning) 22%, transparent); opacity: 1; }
}
.pulse { animation: pl 2s steps(8, jump-none) infinite; }
@keyframes pl { 50% { opacity: 0.5; } }

/* Phase rows (run detail + sidebar-quiet variants share the anatomy). */
.phrow {
  display: flex; align-items: center; gap: 6px; height: 21px; padding: 0 6px;
  border-radius: var(--radius-field); font-size: var(--text-micro); color: var(--fg-subtle);
}
.phrow .g { width: 10px; text-align: center; font-size: 9px; color: var(--fg-hint); }
.phrow.done .g { color: var(--fg-subtle); }
.phrow.run { color: var(--fg-muted); cursor: pointer; }
.phrow.run:hover { background: color-mix(in oklab, var(--surface-2) 35%, transparent); color: var(--fg); }
.phrow.run .g { color: var(--success); }
.phrow .pl { flex-shrink: 0; }
.phrow .plive { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg-hint); font-style: italic; }
.phrow .pt { margin-left: auto; color: var(--fg-hint); font-size: 0.625rem; }

/* ---------- Pane row ---------- */
.panes { flex: 1; display: flex; min-width: 0; }
.pane {
  flex: 1; min-width: 0; display: flex; flex-direction: column;
  border-right: 1px solid color-mix(in oklab, var(--border-subtle) 70%, transparent);
}
.pane:last-child { border-right: none; }
.pane.slide-in { animation: slidein 0.2s ease-out; }
@keyframes slidein { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
.pane-head {
  height: 36px; flex-shrink: 0; display: flex; align-items: center; gap: 8px;
  padding: 0 8px; border-bottom: 1px solid var(--border-subtle);
}
.pane-title {
  font-size: var(--text-sm); font-weight: 500; padding: 2px 6px; border-radius: var(--radius-field);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
.pane-title.focused { background: color-mix(in oklab, var(--accent) 15%, transparent); box-shadow: 0 0 0 1px color-mix(in oklab, var(--accent) 40%, transparent); }
.pane-x { margin-left: auto; color: var(--fg-hint); font-size: 12px; padding: 2px 6px; border-radius: var(--radius-field); }
.pane-x:hover { color: var(--fg); background: color-mix(in oklab, var(--surface-2) 40%, transparent); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 0.625rem; font-weight: 500; }

/* Stacked drill-down chrome: back chevron + crumbs in the pane head. */
.bk { color: var(--fg-subtle); font-size: 15px; line-height: 1; padding: 1px 7px 3px; border-radius: var(--radius-field); flex-shrink: 0; }
.bk:hover { color: var(--fg); background: color-mix(in oklab, var(--surface-2) 40%, transparent); }
.crumb { font-size: var(--text-sm); color: var(--fg-subtle); white-space: nowrap; flex-shrink: 0; padding: 2px 2px; border-radius: var(--radius-field); }
.crumb:hover { color: var(--fg); text-decoration: underline; }
.csep { color: var(--fg-hint); font-size: var(--text-xs); flex-shrink: 0; }
.lvl { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.lvl.slide-in { animation: slidein 0.2s ease-out; }

/* Overview pane controls */
.ov-ctl { display: flex; align-items: center; gap: 10px; margin-left: auto; min-width: 0; }
.q-toggle {
  display: flex; align-items: center; gap: 6px; font-size: var(--text-micro); color: var(--fg-subtle);
  border: 1px solid var(--border-subtle); border-radius: var(--radius-control); padding: 2px 9px; white-space: nowrap;
}
.q-toggle:hover { color: var(--fg); }
.q-toggle .g { font-size: 8px; }
.slots { display: flex; align-items: center; gap: 5px; font-size: var(--text-micro); color: var(--fg-hint); font-variant-numeric: tabular-nums; }
.slots .sd { width: 5px; height: 5px; border-radius: 999px; background: var(--border-strong); opacity: 0.5; }
.slots .sd.busy { background: var(--fg-subtle); opacity: 1; }
.flt { font-size: var(--text-micro); color: var(--fg-subtle); padding: 2px 8px; border-radius: var(--radius-field); white-space: nowrap; }
.flt:hover { color: var(--fg); background: color-mix(in oklab, var(--surface-2) 40%, transparent); }
.newrun { font-size: var(--text-micro); color: var(--fg-subtle); border: 1px solid var(--border-subtle); border-radius: var(--radius-control); padding: 2px 9px; white-space: nowrap; }
.newrun:hover { color: var(--fg); border-color: var(--border); }

/* Workflow-centric overview: sections of workflow rows + the global up-next strip. */
.ov-body { flex: 1; overflow-y: auto; padding: 12px 14px; }
.sec-head {
  display: flex; align-items: center; gap: 6px; padding: 0 4px 7px;
  font-size: var(--text-micro); font-weight: 500; text-transform: uppercase; letter-spacing: 0.14em;
  color: var(--fg-subtle);
}
.sec-head .cnt { color: var(--fg-hint); letter-spacing: 0; font-variant-numeric: tabular-nums; }
.sec-gap { height: 14px; }
.wfrow {
  border: 1px solid var(--border-subtle); border-radius: var(--radius-control);
  background: color-mix(in oklab, var(--card) 40%, transparent);
  padding: 9px 12px; margin-bottom: 8px; cursor: pointer;
}
.wfrow:hover { border-color: var(--border); background: color-mix(in oklab, var(--card) 70%, transparent); }
.wfrow .r1 { display: flex; align-items: baseline; gap: 10px; }
.wfrow .wn { font-size: var(--text-sm); font-weight: 500; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wfrow .agg { margin-left: auto; font-size: var(--text-micro); color: var(--fg-hint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.wfrow .agg .need { color: var(--warning); font-weight: 600; }
.wfrow .agg .need:hover { text-decoration: underline; }
.wfrow .w2 { margin-top: 3px; font-size: var(--text-micro); color: var(--fg-hint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Up-next strip: the queue is global and cross-workflow. */
.uprow {
  display: flex; align-items: center; gap: 7px; height: 26px; padding: 0 8px;
  border-radius: var(--radius-field); font-size: var(--text-xs); color: var(--fg-muted); cursor: grab;
}
.uprow:hover { background: color-mix(in oklab, var(--surface-2) 30%, transparent); }
.uprow:active { cursor: grabbing; }
.uprow .grip { opacity: 0; color: var(--fg-hint); font-size: 9px; letter-spacing: 1px; }
.uprow:hover .grip { opacity: 1; }
.uprow .qpos { font-size: 0.625rem; color: var(--fg-hint); font-variant-numeric: tabular-nums; width: 16px; }
.uprow .ut { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.uprow .um { font-size: 0.625rem; color: var(--fg-hint); white-space: nowrap; }
.uprow.dragging { opacity: 0.35; }
.uprow.over-b { box-shadow: 0 -2px 0 0 var(--accent); }
.uprow.over-a { box-shadow: 0 2px 0 0 var(--accent); }

/* Workflow level: live runs + history + notes. */
.dt-body { flex: 1; overflow-y: auto; padding: 12px 14px; }
.dt-sub { font-size: var(--text-micro); color: var(--fg-hint); padding: 0 4px 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rrow {
  display: flex; align-items: center; gap: 7px; min-height: 26px; padding: 3px 8px;
  border-radius: var(--radius-field); font-size: var(--text-xs); color: var(--fg-muted); cursor: pointer;
  position: relative;
}
.rrow:hover { background: color-mix(in oklab, var(--surface-2) 30%, transparent); color: var(--fg); }
.rrow .rt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rrow .rm { font-size: var(--text-micro); color: var(--fg-hint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rrow .rm .w { color: var(--warning); }
.rrow .rm .e { color: var(--error); }
.rrow.dim { color: var(--fg-subtle); }
.rlive {
  margin: -1px 0 2px 22px; font-size: var(--text-micro); color: var(--fg-hint); font-style: italic;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.rxl { opacity: 0; font-size: var(--text-micro); color: var(--fg-hint); padding: 1px 6px; border-radius: var(--radius-field); flex-shrink: 0; }
.rrow:hover .rxl { opacity: 1; }
.rxl:hover { color: var(--error); background: color-mix(in oklab, var(--error) 12%, transparent); }
.rxl.armed { opacity: 1; color: var(--error); background: color-mix(in oklab, var(--error) 15%, transparent); }
.hrow {
  display: flex; align-items: center; gap: 8px; height: 23px; padding: 0 8px;
  font-size: var(--text-micro); color: var(--fg-subtle);
}
.hrow .ht { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hrow .hm { color: var(--fg-hint); white-space: nowrap; font-variant-numeric: tabular-nums; }
.nextrun {
  display: flex; align-items: center; gap: 8px; padding: 6px 10px; margin-bottom: 4px;
  border: 1px solid var(--border-subtle); border-radius: var(--radius-control);
  font-size: var(--text-xs); color: var(--fg-muted);
}

/* Run level: digest + evidence + the action row, inside the same pane. */
.rd-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px 0; }
.rd-head .cproj { display: flex; align-items: center; gap: 5px; font-size: var(--text-micro); color: var(--fg-hint); }
.rd-count { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: var(--text-micro); color: var(--fg-hint); font-variant-numeric: tabular-nums; }
.rd-count .dots { display: flex; gap: 4px; }
.rd-count .dt { width: 5px; height: 5px; border-radius: 999px; background: var(--border-strong); opacity: 0.5; }
.rd-count .dt.now { background: var(--fg-subtle); opacity: 1; }
.rd-count .dt.res { background: var(--success); opacity: 0.8; }
.rd-title { font-size: 1rem; font-weight: 600; padding: 6px 16px 2px; line-height: 1.35; }
.rd-sub { font-size: var(--text-micro); color: var(--fg-hint); padding: 0 16px 8px; }
.rd-body { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 14px; }
.rd-ann { padding: 0 16px; }
.m-state { font-size: var(--text-micro); font-weight: 600; }

/* Chat pane mock (normal thread) */
.chat { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.toolrow {
  display: flex; align-items: center; gap: 8px; font-size: var(--text-xs);
  border: 1px solid var(--border-subtle); border-radius: var(--radius-control);
  background: color-mix(in oklab, var(--card) 25%, transparent); padding: 6px 10px; color: var(--fg-subtle);
}
.toolrow .ico { font-size: 11px; }
.toolrow .mono { font-family: var(--font-mono); font-size: var(--text-micro); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toolrow .tr-meta { margin-left: auto; font-size: 0.625rem; color: var(--fg-hint); white-space: nowrap; }
.ico-file { color: oklch(0.72 0.16 305); }
.ico-term { color: oklch(0.78 0.12 195); }
.amsg { font-size: var(--text-sm); line-height: 1.65; color: var(--fg-muted); max-width: 62ch; }

};
const RES_LABELS = {
  approve: 'approved', reject: 'sent back', answer: 'answered', takeover2: 'taken over',
  takeover3: 'taken over', reenqueue: 're-enqueued', discard5: 'discarded', handoff: 'handed off',

/* ============================ Utilities ============================ */
let toastTimer = null;
function toast(msg) {
  const t = $('#toast'); t.innerHTML = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
function eff(id) { const r = S.resolved[id]; return r ? RES[r] : null; }
function needsIds() { return PARKED.filter((id) => !S.resolved[id]); }
function attnCount(ids) { return ids.filter((id) => !S.resolved[id] && ['gate', 'question', 'failed'].includes(ITEMS[id].state)).length; }
function ann(txt) { return '<div class="ann"><span class="i-dot">i</span><span>' + txt + '</span></div>'; }
function pdot(pid) { return '<span class="sdot" style="width:6px;height:6px;border-radius:2px;background:' + PROJ[pid].color + '"></span>'; }

/* colOf: a run's effective lane. */
function colOf(id) {
  const r = eff(id);
  if (r) return r.col;
  const it = ITEMS[id];
  if (!it) return null;
  const st = it.state;
  if (st === 'gate' || st === 'question' || st === 'failed') return 'attn';
  if (st === 'running') return 'run';
  if (st === 'queued') return 'queue';
  return 'settled';
}

/* ---------- stack navigation (D11 amendment 2) ---------- */
function stkTop() { return S.stack[S.stack.length - 1]; }
function curRun() {
  const t = stkTop();
  return S.panes.includes('wf') && t.v === 'run' ? t.id : null;
}
function resetLevelState() {
  S.diffOpen = {}; S.pr = false; S.prOpen = false; S.doneView = 'manual'; S.cancelArm = false;
}
function setRun(id) {
  S.stack = [{ v: 'ov' }, { v: 'wf', wf: WFKEY[ITEMS[id].wf] }, { v: 'run', id }];
  resetLevelState();
  render();
}
function openRun(id) {
  if (!S.panes.includes('wf')) S.panes = S.panes.concat('wf');
  S._slide = true;
  setRun(id);
}
function pushWf(wf) {
  S.stack = [{ v: 'ov' }, { v: 'wf', wf }];
  S.wfNotesOpen = false; resetLevelState();
  S._slide = true;
  render();
}
function goBack() {
  if (S.stack.length <= 1) return;
  S.stack.pop();
  resetLevelState();
  render();
}
function popTo(i) {
  S.stack = S.stack.slice(0, i + 1);
  resetLevelState();
  render();
}
function lvlLabel(lv) {
  if (lv.v === 'ov') return 'Workflows';
  if (lv.v === 'wf') return WFS[lv.wf].name;
  if (lv.v === 'run') return ITEMS[lv.id].title;
  return 'All clear';
}

/* ============================ Sidebar ============================ */
function runRowSidebar(id) {
  const it = ITEMS[id];
  const r = eff(id);
  if (r && r.col === null) return '';
  let signal = '', meta = '', cls = '';
  if (r) { meta = r.rowMeta; cls = ' dim'; }
  else if (it.state === 'gate' || it.state === 'question') {
    signal = '<span class="sdot s-warn-bg pulse"></span><span class="slabel s-warn">Needs you</span>';
    meta = it.parked; cls = ' glow-warn';
  } else if (it.state === 'failed') {
    signal = '<span class="sdot s-err-bg"></span><span class="slabel s-err">Failed</span>';
    meta = it.parked;
  } else if (it.state === 'running') {
    meta = it.phn + '/' + it.of + ' · ' + it.elapsed;
  } else if (it.state === 'queued') { meta = 'queued'; cls = ' dim'; }
  else if (it.state === 'done') { meta = 'done'; cls = ' dim'; }
  else if (it.state === 'cancelled') return '';
  if (curRun() === id) cls += ' active';
  return '<div class="jrow' + cls + '" data-item="' + id + '" title="' + it.title + '">' +
    signal + '<span class="jt">' + it.title + '</span><span class="jm">' + meta + '</span></div>';
}

function wfSection(pid) {
  const open = S.wfOpen[pid];
  let roll = '';
  if (S.quiet) {
    roll = '<span class="cnt">' + QUIET[pid].length + '</span>';
  } else if (!open) {
    const need = attnCount(RUNS[pid]);
    const total = RUNS[pid].filter((id) => { const r = eff(id); return !(r && r.col === null) && ITEMS[id].state !== 'cancelled'; }).length;
    roll = need > 0
      ? '<span class="sdot s-warn-bg"></span><span class="need">' + need + '</span>'
      : '<span class="cnt">' + total + '</span>';
  }
  let h = '<div class="wfhead' + (open ? ' open' : '') + '" data-wfsec="' + pid + '">' +
    '<span class="chev">▶</span><span>Workflows</span><span class="roll">' + roll + '</span></div>';
  if (open) {
    if (S.quiet) {
      for (const q of QUIET[pid]) h += '<div class="jrow dim"><span class="jt">' + q.t + '</span><span class="jm">' + q.m + '</span></div>';
    } else {
      for (const id of RUNS[pid]) h += runRowSidebar(id);
    }
  }
  return h;
}

function renderSidebar() {
  let h = '';
  for (const pid of ['ao', 'm32', 'dsp']) {
    h += '<div class="proj"><div class="proj-row"><span class="chev">▶</span><span class="folder">▣</span><span class="pname">' + PROJ[pid].name + '</span></div>';
    h += '<div class="rail">';
    for (const [t, tm] of THREADS[pid]) {
      const active = S.panes.includes('thread') && pid === 'ao' && t === THREADS.ao[0][0];
      h += '<div class="trow' + (active ? ' active' : '') + '"><span class="tt">' + t + '</span><span class="tm">' + tm + '</span></div>';
    }
    if (pid === 'ao' && S.extraThread) {
      h += '<div class="trow"><span class="sdot s-ok-bg pulse"></span><span class="slabel s-ok">Working</span><span class="tt">' + S.extraThread + '</span><span class="tm">now</span></div>';
    }
    h += wfSection(pid);
    if (pid === 'ao') {
      h += S.quiet
        ? ann('<b>The normal-view test.</b> Nothing needs you, so workflows are one hint-toned line per project — no badges, no color, no count that begs. The sidebar is still about your threads.')
        : ann('<b>One signal per row.</b> Amber (with AO’s existing glow) only when a human unblocks it; red only on failed. Running, queued, done are typographic — color is reserved for “needs you.” Done-awaiting-disposition stays neutral here (D11 amendment). A row click lands on the run’s detail level, not a summary.');
    }
    if (pid === 'm32' && !S.quiet && !S.wfOpen.m32) {
      h += ann('Collapsed projects roll up to a <b>single amber count</b> — glanceable across many repos without expanding anything.');
    }
    h += '</div></div>';

}

/* ============================ Overview level ============================ */
function wfVisible(wf) {
  if (S.filter === 'all') return true;
  if (WFS[wf].scope === 'shared') return true;
  return WFS[wf].scope === S.filter;
}
function wfAggregate(wf) {
  const w = WFS[wf];
  if (wf === 'jp') {
    const q = w.runs.filter((id) => colOf(id) === 'queue').length;
    return '<span>next run ' + w.next + '</span>' + (q ? ' · ' + q + ' queued' : '');
  }
  if (wf === 'mlr') return 'idle · ' + w.last;
  const need = attnCount(w.runs);
  const dispose = w.runs.filter((id) => ITEMS[id] && ITEMS[id].state === 'done' && !S.resolved[id]).length;
  const running = w.runs.filter((id) => colOf(id) === 'run').length;
  const queued = w.runs.filter((id) => colOf(id) === 'queue').length;
  const parts = [];
  if (running) parts.push(running + ' running');
  if (queued) parts.push(queued + ' queued');
  if (dispose) parts.push(dispose + ' to dispose');
  const neutral = parts.length ? parts.join(' · ') : 'idle';
  return (need > 0 ? '<span class="need" data-sweep title="Step through what needs you (j/k)">' + need + ' need you</span> · ' : '') + neutral;
}
function wfRow(wf) {
  if (!wfVisible(wf)) return '';

    '<div class="w2">' + second + '</div></div>';
}
function upNextIds() {

}
function upRow(id, pos) {

function ovBody() {

/* ============================ Workflow level ============================ */
function runRowDetail(id) {
  const it = ITEMS[id];
  const r = eff(id);
  let signal = '', meta = '', cls = '', extra = '', below = '';
  if (r) {
    if (r.col === null) return '';
    cls = ' dim'; meta = r.cardMeta;
    if (r.col === 'run' && r.live) below = '<div class="rlive">' + r.live + '</div>';
  } else if (it.state === 'gate') {
    signal = '<span class="sdot s-warn-bg pulse"></span><span class="slabel s-warn">Needs you</span>';
    meta = '<span class="w">review gate</span> · +' + it.diff.add + ' −' + it.diff.del + ' · checks ✓ · ' + it.parked;
  } else if (it.state === 'question') {
    signal = '<span class="sdot s-warn-bg pulse"></span><span class="slabel s-warn">Needs you</span>';
    meta = '<span class="w">asks</span> — v1 vs v2 · ' + it.parked;
  } else if (it.state === 'failed') {
    signal = '<span class="sdot s-err-bg"></span><span class="slabel s-err">Failed</span>';
    meta = 'check ×3 · genuine · ' + it.parked;
  } else if (it.state === 'running') {
    meta = it.phase + ' · ' + it.phn + '/' + it.of + ' · ' + it.elapsed + ' · ' + it.cost;
    extra = '<button class="rxl' + (S.cancelArm ? ' armed' : '') + '" data-cancel="' + id + '">' + (S.cancelArm ? 'stop this run?' : '✕') + '</button>';
    below = '<div class="rlive">' + it.live + '</div>';
  } else if (it.state === 'queued') {
    const up = upNextIds(); const pos = up.indexOf(id) + 1;
    cls = ' dim';
    meta = 'queued' + (pos ? ' · #' + pos : '') + (it.via ? ' · spawned ' + it.ago + ' ago' : '');
  } else if (it.state === 'done') {
    cls = ' dim';
    meta = 'done · to dispose · ' + it.cost + ' · ' + it.parked;
  } else if (it.state === 'cancelled') {
    cls = ' dim'; meta = 'cancelled · worktree kept';
  } else return '';
  return '<div class="rrow' + cls + '" data-item="' + id + '" title="' + it.title + '">' +
    pdot(it.proj) + signal + '<span class="rt">' + it.title + '</span><span class="rm">' + meta + '</span>' + extra + '</div>' + below;
}

function wfBody(wf) {
  const w = WFS[wf];
  let h = '<div class="dt-body">';
  h += '<div class="dt-sub">' + (wf === 'jp' ? PROJ.m32.name : w.scope) + ' · ' + w.meta + ' · ' + w.chain + '</div>';

  if (live.length) {

  }
  if (wf === 'bv') {

  }

  h += '<div class="sec-gap"></div><div class="sec-head">History' + (w.total ? ' <span class="cnt">' + w.total + ' runs</span>' : '') + '</div>';

/* ============================ Run level ============================ */
function stateWord(id) {
  const st = ITEMS[id].state;
  if (st === 'gate') return '<span class="m-state s-warn">Review gate</span>';
  if (st === 'question') return '<span class="m-state s-warn">Question</span>';
  if (st === 'failed') return '<span class="m-state s-err">Failed</span>';
  if (st === 'done') return '<span class="m-state" style="color:var(--fg-subtle)">Done</span>';
  if (st === 'queued') return '<span class="m-state" style="color:var(--fg-subtle)">Queued</span>';
  if (st === 'running') return '<span class="m-state" style="color:var(--fg-subtle)">Running</span>';
  if (st === 'cancelled') return '<span class="m-state" style="color:var(--fg-subtle)">Cancelled</span>';
  return '';
}
function subLine(id) {
  const it = ITEMS[id];
  const bits = [];
  if (it.wf) bits.push(it.wf);
  if (it.phase) bits.push(it.phase + ' ' + it.phn + '/' + it.of);
  if (it.via) bits.push('spawned by ' + it.via + ' · every ' + it.every);
  if (it.parked && it.state !== 'done') bits.push('parked ' + it.parked);
  if (it.state === 'done') bits.push('finished ' + it.parked + ' ago');
  if (it.cost) bits.push(it.cost);
  return bits.join(' · ');
}
function digest(id) {

}
function checksRow(id) {

}

  });
  h += ann('<b>Gate review leads with the evidence</b> (D4.4): diff summary, checks, cost. File rows expand in place — the full review, if you want it, is the phase thread itself. No envelope, no gate trace, no variables (D11).');
  h += '</div>';
  return h;
}

/* ============================ Moments ============================ */
function setMoment(n) {
  S.m = n; S.intake = false; S.cancelArm = false;
  S.quiet = (n === 1);
  switch (n) {
    case 1:
      S.panes = ['thread']; S.wfOpen = { ao: false, m32: false, dsp: false };
      S.stack = [{ v: 'ov' }];
      break;
    case 2:
      S.panes = ['wf']; S.wfOpen = { ao: true, m32: false, dsp: false };
      S.stack = [{ v: 'ov' }];
      break;
    case 3:
      S.panes = ['wf']; S.wfOpen = { ao: true, m32: false, dsp: false };
      S.stack = [{ v: 'ov' }, { v: 'wf', wf: 'bv' }];
      break;
    case 4: {
      S.panes = ['wf']; S.wfOpen = { ao: true, m32: false, dsp: false };
      const first = needsIds()[0] ?? PARKED[0];
      S.stack = [{ v: 'ov' }, { v: 'wf', wf: WFKEY[ITEMS[first].wf] }, { v: 'run', id: first }];
      S.diffOpen = {};
      break;
    }
    case 5:
      S.panes = ['wf']; S.wfOpen = { ao: true, m32: false, dsp: false };
      S.stack = [{ v: 'ov' }, { v: 'wf', wf: 'bv' }, { v: 'run', id: 2 }];
      S.diffOpen = { 0: true };
      break;
    case 6:
      S.panes = ['wf']; S.wfOpen = { ao: true, m32: false, dsp: false };
      S.stack = [{ v: 'ov' }];
      S.intake = true; S.intakeWf = 'bv'; S.intakeProj = 'ao';
      break;
    case 7:
      S.panes = ['wf', 'phase']; S.wfOpen = { ao: true, m32: false, dsp: false };
      S.stack = [{ v: 'ov' }, { v: 'wf', wf: 'bv' }, { v: 'run', id: 1 }];
      S.phaseCfg = null;
      break;
    case 8:
      S.panes = ['wf']; S.wfOpen = { ao: false, m32: true, dsp: false };
      S.stack = [{ v: 'ov' }, { v: 'wf', wf: 'jp' }];
      S.wfNotesOpen = true;
      break;
    case 9:
      S.panes = ['wf']; S.wfOpen = { ao: false, m32: false, dsp: true };
      S.stack = [{ v: 'ov' }, { v: 'wf', wf: 'bv' }, { v: 'run', id: 4 }];
      S.doneView = 'manual';
      break;
    case 10:
      S.panes = ['wf', 'handoff']; S.wfOpen = { ao: true, m32: false, dsp: false };
      S.stack = [{ v: 'ov' }, { v: 'wf', wf: 'bv' }, { v: 'run', id: 5 }];
      if (!S.resolved[5]) { S.resolved[5] = 'handoff'; S.extraThread = 'triage: flaky test hunt'; }
      S.handoff = null;
      break;
  }
  location.hash = 'm' + n;
  render();
}

function render() {
  $$('#tabs .m-tab').forEach((t) => t.classList.toggle('on', +t.dataset.m === S.m));
  $('#mdesc').textContent = S.m + ' · ' + MOMENTS[S.m - 1].desc;
  renderSidebar();
  renderPanes();
  if (S.intake) renderIntake(); else $('#modalRoot').innerHTML = '';
}

/* ============================ Actions ============================ */
function resolve(id, kind) {
  S.resolved[id] = kind;
  render();
  const t = stkTop();
  if (t.v === 'run' && t.id === id && PARKED.includes(id)) {
    setTimeout(() => {
      const t2 = stkTop();
      if (!(t2.v === 'run' && t2.id === id) || !S.panes.includes('wf')) return;
      const rest = needsIds();
      if (rest.length === 0) {
        const parts = PARKED.map((pid) => '1 ' + (RES_LABELS[S.resolved[pid]] || S.resolved[pid]));
        S.stack = [{ v: 'ov' }, { v: 'clear', sum: PARKED.length + ' resolved — ' + parts.join(' · ') + ' · $11.54 reviewed' }];
        render();
      } else {
        const idx = PARKED.indexOf(id);
        const next = PARKED.slice(idx + 1).concat(PARKED.slice(0, idx)).find((pid) => !S.resolved[pid]);
        setRun(next);
      }
    }, 650);
  }
}
function stepTo(dir) {
  const t = stkTop();
  if (t.v !== 'run' || !PARKED.includes(t.id)) return;
  const idx = PARKED.indexOf(t.id);
  setRun(PARKED[(idx + dir + PARKED.length) % PARKED.length]);
}
function openHandoff(cfg, extraThreadTitle) {
  S.handoff = cfg;
  if (extraThreadTitle) S.extraThread = extraThreadTitle;
  S.panes = S.panes.filter((p) => p !== 'phase' && p !== 'handoff').concat('handoff');
  render();
}
function openPhasePane(cfg) {
  S.phaseCfg = cfg || null;
  S.panes = S.panes.filter((p) => p !== 'handoff' && p !== 'phase').concat('phase');
  render();
}

function runAct(act) {
  const id = curRun();
  if (act === 'approve' && id === 2) resolve(2, 'approve');
  else if (act === 'reject' && id === 2) resolve(2, 'reject');
  else if (act === 'takeover' && id === 2) {
    S.resolved[2] = 'takeover2'; render();
    setTimeout(() => openPhasePane({ title: 'review — retention settings' }), 400);
    toast('Turn interrupted — the review thread is yours to steer (§7)');
  }
  else if (act === 'answer' && id === 3) {
    const v = ($('#ansin') && $('#ansin').value.trim()) || ITEMS[3].sugg[0];
    RES.answer.line = 'Answered — “' + v + '” · the phase resumes its turn';
    resolve(3, 'answer');
  }
  else if (act === 'takeover' && id === 3) {
    S.resolved[3] = 'takeover3'; render();
    setTimeout(() => openPhasePane({ title: 'implement — session pooling' }), 400);
    toast('Turn is already yielded — thread opens for free-form steering (§7)');
  }
  else if (act === 'reenqueue' && id === 5) resolve(5, 'reenqueue');
  else if (act === 'discard' && id === 5) resolve(5, 'discard5');
  else if (act === 'handoff' && id === 5) {
    S.resolved[5] = 'handoff';
    openHandoff(null, 'triage: flaky test hunt');
  }
  else if (act === 'merge' && id === 4) resolve(4, 'merge');
  else if (act === 'discard' && id === 4) resolve(4, 'discard4');
  else if (act === 'pr' && id === 4) { S.pr = true; render(); toast('PR #214 created from wf/bump-tailwind-v41'); }
  else if (act === 'sendcomments' && id === 4) {
    resolve(4, 'prfix');
    toast('2 comments sent — fix turn queued in the run’s worktree');
  }
  else if (act === 'continue4') {
    openHandoff({
      title: 'continue: tailwind bump',
      chip: 'bump-tailwind-v41 — run record · diff · branch',
      msg: 'Pick this up — same worktree. I want the token aliases double-checked against the light theme before it merges.',
      reply: 'On it. Diffing the three renamed tokens against the light-mode block now <span class="caret"></span>',
    }, 'continue: tailwind bump');
  }
  else if (act === 'dequeue') { goBack(); toast('Removed from queue' + (id === 6 ? ' — jira-poll will propose it again next cycle' : '')); }
  else if (act === 'cancelrun') {
    ITEMS[1].state = 'cancelled'; S.cancelArm = false;
    const t = stkTop();
    if (t.v === 'run' && t.id === 1) goBack(); else render();
    toast('Teardown — turn stopped, locks released, worktree kept');
  }
  else if (act === 'enqueue') { S.intake = false; render(); toast('Queued — position 3 · starts when a slot frees'); }
  else if (act === 'chatqueue') { S.intake = false; render(); toast('Queued from chat — same shape, same queue'); }
}

/* ============================ Events ============================ */
document.addEventListener('click', (e) => {
  const tab = e.target.closest('.m-tab');
  if (tab) { setMoment(+tab.dataset.m); return; }
  if (e.target.closest('#notesBtn')) { document.body.classList.toggle('notes'); return; }

  const close = e.target.closest('[data-close]');
  if (close) { S.intake = false; render(); return; }

  const dfile = e.target.closest('[data-dfile]');
  if (dfile) { const i = +dfile.dataset.dfile; S.diffOpen[i] = !S.diffOpen[i]; render(); return; }

  const sugg = e.target.closest('[data-sugg]');
  if (sugg) { const inp = $('#ansin'); if (inp) inp.value = sugg.dataset.sugg; return; }

  const view = e.target.closest('[data-view]');
  if (view) { S.doneView = view.dataset.view; render(); return; }

  const prc = e.target.closest('[data-pr-comments]');
  if (prc) { S.prOpen = !S.prOpen; render(); return; }
  if (e.target.closest('[data-open-pr]')) { toast('Opens the PR in the browser'); return; }

  const wfn = e.target.closest('[data-wfnotes]');
  if (wfn) { S.wfNotesOpen = !S.wfNotesOpen; render(); return; }

  const act = e.target.closest('[data-act]');
  if (act) { e.stopPropagation(); runAct(act.dataset.act); return; }

  const cancel = e.target.closest('[data-cancel]');
  if (cancel) {
    e.stopPropagation();
    if (S.cancelArm) runAct('cancelrun');
    else { S.cancelArm = true; render(); }
    return;
  }

  const phase = e.target.closest('[data-phase-open]');
  if (phase) { e.stopPropagation(); openPhasePane(null); return; }

  const wfsec = e.target.closest('[data-wfsec]');
  if (wfsec) { const p = wfsec.dataset.wfsec; S.wfOpen[p] = !S.wfOpen[p]; render(); return; }

  const sweep = e.target.closest('[data-sweep]');
  if (sweep) {
    e.stopPropagation();
    const first = needsIds()[0];
    if (first) openRun(first);
    return;
  }

  const bk = e.target.closest('[data-back]');
  if (bk) { goBack(); return; }

  const crumb = e.target.closest('[data-crumb]');
  if (crumb) { popTo(+crumb.dataset.crumb); return; }

  const wfrow = e.target.closest('[data-wf-open]');
  if (wfrow) { pushWf(wfrow.dataset.wfOpen); return; }

  const row = e.target.closest('[data-item]');
  if (row) { openRun(+row.dataset.item); return; }

  if (e.target.closest('#qToggle')) {
    S.queueActive = !S.queueActive; render();
    toast(S.queueActive ? 'Queue active — draining by priority' : 'Paused — running items finish; nothing new starts');
    return;
  }
  if (e.target.closest('#fltBtn')) {
    const order = ['all', 'ao', 'm32', 'dsp'];
    S.filter = order[(order.indexOf(S.filter) + 1) % order.length];
    render(); return;
  }
  if (e.target.closest('#newRun')) { S.intake = true; S.intakeWf = 'bv'; S.intakeProj = 'ao'; render(); return; }

  const wf = e.target.closest('[data-wf]');
  if (wf) { S.intakeWf = wf.dataset.wf; renderIntake(); return; }
  const pj = e.target.closest('[data-proj]');
  if (pj && S.intake) { S.intakeProj = pj.dataset.proj; renderIntake(); return; }
});

document.addEventListener('keydown', (e) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
  if (typing) {
    if (e.key === 'Escape') e.target.blur();
    else if (e.key === 'Enter' && e.target.id === 'ansin') { e.preventDefault(); runAct('answer'); }
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;

  const id = curRun();
  const st = id ? ITEMS[id].state : null;
  const live = id && !S.resolved[id] && !S.intake;
  const questionOpen = live && st === 'question';

  if (/^[0-9]$/.test(e.key)) {
    if (questionOpen) {
      if (e.key === '1' || e.key === '2') {
        const inp = $('#ansin'); if (inp) inp.value = ITEMS[3].sugg[+e.key - 1];
        runAct('answer');
      }
      return;
    }
    setMoment(e.key === '0' ? 10 : +e.key); return;
  }
  if (e.key === 'i') { document.body.classList.toggle('notes'); return; }
  if (e.key === 'Escape') {
    if (S.cancelArm) { S.cancelArm = false; render(); return; }
    if (S.intake) { S.intake = false; render(); return; }
    if (S.panes.includes('wf')) goBack();
    return;
  }
  if (e.key === 'Backspace') { if (!S.intake && S.panes.includes('wf')) goBack(); return; }
  if (S.intake || !id) return;

  if (PARKED.includes(id) && (e.key === 'j' || e.key === 'ArrowRight' || e.key === 'ArrowDown')) { stepTo(1); return; }
  if (PARKED.includes(id) && (e.key === 'k' || e.key === 'ArrowLeft' || e.key === 'ArrowUp')) { stepTo(-1); return; }
  if (S.resolved[id]) return;
  if (st === 'gate') {
    if (e.key === 'a') runAct('approve');
    else if (e.key === 'r') runAct('reject');
    else if (e.key === 't') runAct('takeover');
    else if (e.key === 'Enter') { S.diffOpen[0] = !S.diffOpen[0]; render(); }
  } else if (st === 'question') {
    if (e.key === 'a') { e.preventDefault(); const inp = $('#ansin'); if (inp) inp.focus(); }
    else if (e.key === 't') runAct('takeover');
  } else if (st === 'failed') {
    if (e.key === 'a') runAct('reenqueue');
    else if (e.key === 'r') runAct('discard');
    else if (e.key === 't') runAct('handoff');
  } else if (st === 'done') {
    if (e.key === 'a') runAct('merge');
    else if (e.key === 'r') runAct('discard');
    else if (e.key === 't') runAct('continue4');
  }
});

/* ---------- drag-reorder the global up-next strip ---------- */
let dragEl = null;
function bindDnD() {
  $$('.uprow').forEach((row) => {
    row.addEventListener('dragstart', () => { dragEl = row; row.classList.add('dragging'); });
    row.addEventListener('dragend', () => {
      if (dragEl) dragEl.classList.remove('dragging');
      $$('.uprow').forEach((c) => c.classList.remove('over-b', 'over-a'));
      dragEl = null;
    });
    row.addEventListener('dragover', (e) => {
      if (!dragEl || dragEl === row) return;
      e.preventDefault();
      const before = e.offsetY < row.offsetHeight / 2;
      row.classList.toggle('over-b', before);
      row.classList.toggle('over-a', !before);
    });
    row.addEventListener('dragleave', () => row.classList.remove('over-b', 'over-a'));
    row.addEventListener('drop', (e) => {
      if (!dragEl || dragEl === row) return;
      e.preventDefault();
      const a = +dragEl.dataset.qid, b = +row.dataset.qid;
      if (!S.qorder.includes(a) || !S.qorder.includes(b)) { dragEl = null; return; }
      const before = e.offsetY < row.offsetHeight / 2;
      S.qorder = S.qorder.filter((x) => x !== a);
      const bi = S.qorder.indexOf(b);
      S.qorder.splice(before ? bi : bi + 1, 0, a);
      dragEl = null;
      render();
      toast('Priority reordered — the drain picks it up immediately');
    });
  });
}

/* ============================ Boot ============================ */
$('#tabs').innerHTML = MOMENTS.map((m) =>
  '<button class="m-tab" data-m="' + m.n + '"><span class="n">' + m.key + '</span>' + m.tab + '</button>').join('');
window.addEventListener('hashchange', () => {
  const h = /^#m(10|[1-9])$/.exec(location.hash);
  if (h && +h[1] !== S.m) setMoment(+h[1]);
});
const boot = /^#m(10|[1-9])$/.exec(location.hash);
setMoment(boot ? +boot[1] : 1);
</script>

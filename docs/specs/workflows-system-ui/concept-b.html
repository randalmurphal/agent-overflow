<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept B — Sidebar-integrated · Workflows UI</title>
<style>
/* ============================================================
   Tokens — mirrored from frontend/src/app.css + styles/tokens.css
   (dark theme lens). Do not invent values; extend only with the
   three project identity colors the brief assigns.
   ============================================================ */
:root {
  color-scheme: dark;
  --surface-0: oklch(0.145 0.014 285.82);
  --surface-1: oklch(0.178 0.014 285.82);
  --surface-2: oklch(0.215 0.014 285.82);
  --code-inline-bg: oklch(0.275 0.014 285.82);
  --border: oklch(0.3 0.014 285.82);
  --border-strong: oklch(0.52 0.014 285.82);
  --border-subtle: color-mix(in oklab, var(--border) 55%, transparent);
  --text-primary: oklch(0.95 0.006 285.82);
  --text-secondary: oklch(0.7 0.006 285.82);
  --fg-muted: color-mix(in oklab, var(--text-primary) 80%, transparent);
  --fg-subtle: color-mix(in oklab, var(--text-primary) 55%, transparent);
  --fg-hint: color-mix(in oklab, var(--text-primary) 30%, transparent);
  --accent: oklch(0.58 0.19 276);
  --info: oklch(0.62 0.17 250);
  --success: oklch(0.7 0.17 150);
  --error: oklch(0.63 0.2 25);
  --warning: oklch(0.75 0.15 75);
  --card: var(--surface-1);
  --proj-ao: oklch(0.62 0.17 250);   /* agent-overflow · blue   */
  --proj-m32: oklch(0.72 0.15 55);   /* m32rimm · orange        */
  --proj-dsp: oklch(0.7 0.17 150);   /* dispatch · green        */
  --radius-field: 6px;
  --radius-control: 10px;
  --radius-card: 16px;
  --shadow-menu: 0 8px 24px -12px color-mix(in oklab, black 40%, transparent);
  --font-sans: 'Geist Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--surface-0); color: var(--text-primary);
  font-family: var(--font-sans); font-size: 0.8125rem; line-height: 1.45;
  font-feature-settings: "ss01", "cv11";
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column; overflow: hidden;
}
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb {
  background: color-mix(in oklab, var(--border) 78%, transparent);
  border: 2px solid transparent; border-radius: 999px; background-clip: padding-box;
}
::-webkit-scrollbar-track { background: transparent; }
button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; }
::selection { background: color-mix(in oklab, var(--accent) 28%, transparent); }

/* Stepped pulse (perf rationale in app.css — ambient indicators only). */
@keyframes pulse { 50% { opacity: 0.5; } }
.pulse { animation: pulse 2s steps(8, jump-none) infinite; }

/* ============ Fixed concept header + moment nav ============ */
.hdr {
  flex: none; height: 44px; display: flex; align-items: center; gap: 14px;
  padding: 0 14px; border-bottom: 1px solid var(--border-subtle);
  background: var(--surface-1); z-index: 60;
}
.hdr .mark {
  width: 22px; height: 22px; border-radius: 7px; background: var(--accent);
  color: white; font-weight: 700; font-size: 12px;
  display: flex; align-items: center; justify-content: center; flex: none;
}
.hdr .cname { font-size: 12.5px; font-weight: 650; white-space: nowrap; }
.hdr .csub { font-size: 11px; color: var(--fg-hint); white-space: nowrap; }
.mtabs { display: flex; gap: 2px; margin-left: auto; }
.mtab {
  display: flex; align-items: center; gap: 6px; padding: 4px 9px;
  border-radius: var(--radius-field); font-size: 11.5px; color: var(--fg-subtle);
  white-space: nowrap;
}
.mtab:hover { background: color-mix(in oklab, var(--surface-2) 70%, transparent); color: var(--fg-muted); }
.mtab.on { background: var(--surface-2); color: var(--text-primary); }
.mtab .n {
  font-family: var(--font-mono); font-size: 10px; color: var(--fg-hint);
  border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; line-height: 14px;
}
.mtab.on .n { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 50%, var(--border)); }
.hdr .rhs { display: flex; align-items: center; gap: 10px; margin-left: 6px; }
.annbtn {
  display: flex; align-items: center; gap: 6px; padding: 3px 9px;
  border: 1px solid var(--border); border-radius: 999px;
  font-size: 11px; color: var(--fg-subtle);
}
.annbtn:hover { border-color: var(--border-strong); color: var(--fg-muted); }
.annbtn.on {
  color: var(--accent); border-color: color-mix(in oklab, var(--accent) 60%, transparent);
  background: color-mix(in oklab, var(--accent) 12%, transparent);
}
.annbtn .ic { font-style: normal; font-size: 12px; }

/* Context strip: one line naming the moment + its live keys. */
.ctx {
  flex: none; display: flex; align-items: center; gap: 10px; padding: 5px 14px;
  border-bottom: 1px solid var(--border-subtle); font-size: 11.5px; color: var(--fg-subtle);
  background: color-mix(in oklab, var(--surface-1) 45%, transparent);
}
.ctx .mt { color: var(--fg-muted); font-weight: 600; }
.ctx .keys { margin-left: auto; display: flex; gap: 8px; align-items: center; white-space: nowrap; }
.kbd {
  font-family: var(--font-mono); font-size: 10px; color: var(--fg-subtle);
  background: var(--surface-2); border: 1px solid var(--border);
  border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; line-height: 15px;
  display: inline-block;
}

/* ==================== App shell ==================== */
.shell { flex: 1; min-height: 0; display: flex; }

/* ==================== Sidebar ==================== */
.sb {
  width: 302px; flex: none; display: flex; flex-direction: column;
  border-right: 1px solid var(--border-subtle); min-height: 0;
}
.sb-search {
  margin: 8px 8px 4px; height: 27px; display: flex; align-items: center; gap: 7px;
  padding: 0 9px; background: var(--surface-1); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-control); color: var(--fg-hint); font-size: 12px;
}
.sb-search .k { margin-left: auto; }
.sb-head {
  display: flex; align-items: center; padding: 8px 12px 4px; gap: 6px;
}
.micro {
  font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--fg-subtle); font-weight: 600;
}
.sb-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 6px 10px; }

.prow {
  display: flex; align-items: center; gap: 6px; padding: 3px 8px;
  border-radius: var(--radius-field); cursor: pointer;
}
.prow:hover { background: color-mix(in oklab, var(--surface-2) 40%, transparent); }
.chev { width: 12px; height: 12px; flex: none; color: var(--fg-subtle); transition: transform .12s; }
.chev.open { transform: rotate(90deg); }
.pname { font-size: 0.78125rem; font-weight: 550; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pdot { width: 8px; height: 8px; border-radius: 3px; flex: none; }
.pkids {
  margin-left: 10px; padding-left: 8px;
  border-left: 1px solid color-mix(in oklab, var(--border-subtle) 60%, transparent);
  display: flex; flex-direction: column; gap: 1px;
}
.trow {
  display: flex; align-items: center; gap: 6px; padding: 2.5px 8px;
  border-radius: var(--radius-field); color: var(--fg-muted); font-size: 0.76rem;
  cursor: pointer; min-width: 0;
}
.trow:hover { background: color-mix(in oklab, var(--surface-2) 40%, transparent); }
.trow .tt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .tic { flex: none; color: var(--fg-hint); display: flex; }

/* Work section — the centerpiece of Concept B. */
.whead {
  display: flex; align-items: center; gap: 5px; padding: 3px 8px 2px;
  margin-top: 4px; border-radius: var(--radius-field); cursor: pointer; min-width: 0;
}
.whead:hover { background: color-mix(in oklab, var(--surface-2) 40%, transparent); }
.whead .micro { flex: none; }
.whead .rollup { display: flex; gap: 4px; margin-left: auto; align-items: center; min-width: 0; }
.whead .wplus { opacity: 0; color: var(--fg-subtle); display: flex; border-radius: 4px; padding: 1px; }
.whead:hover .wplus { opacity: 1; }
.whead .wplus:hover { color: var(--text-primary); background: color-mix(in oklab, var(--surface-2) 70%, transparent); }
.rchip {
  font-size: 10px; line-height: 15px; padding: 0 6px; border-radius: 999px;
  white-space: nowrap; font-weight: 550;
}
.rchip.warn { color: var(--warning); background: color-mix(in oklab, var(--warning) 14%, transparent); }
.rchip.run  { color: color-mix(in oklab, var(--accent) 60%, var(--text-primary)); background: color-mix(in oklab, var(--accent) 18%, transparent); }
.rchip.ok   { color: var(--success); background: color-mix(in oklab, var(--success) 13%, transparent); }
.rchip.mut  { color: var(--fg-subtle); background: color-mix(in oklab, var(--surface-2) 80%, transparent); }

.witem {
  position: relative; display: flex; align-items: center; gap: 6px;
  padding: 3px 8px; border-radius: var(--radius-field); cursor: pointer; min-width: 0;
}
.witem:hover { background: color-mix(in oklab, var(--surface-2) 40%, transparent); }
.witem.active { background: color-mix(in oklab, var(--accent) 16%, transparent); }
.witem .wt {
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 0.76rem; color: var(--fg-muted);
}
.witem.settled .wt { color: var(--fg-subtle); }
.witem .wm {
  flex: none; font-family: var(--font-mono); font-size: 9.5px; color: var(--fg-subtle);
  white-space: nowrap;
}
.wic { width: 14px; height: 14px; flex: none; display: flex; align-items: center; justify-content: center; }
.wic svg { display: block; }
.st-run { color: var(--accent); } .st-gate { color: var(--warning); }
.st-q { color: var(--info); } .st-done { color: var(--success); }
.st-fail { color: var(--error); } .st-queued, .st-cancelled { color: var(--fg-hint); }
.autob {
  display: inline-flex; align-items: center; gap: 3px; font-size: 9px; line-height: 14px;
  font-family: var(--font-mono); padding: 0 5px; border-radius: 999px; flex: none;
  color: var(--info); background: color-mix(in oklab, var(--info) 13%, transparent);
}

/* Attention glow — copied from app.css status-glow (stepped). */
.glow-warn, .glow-info { position: relative; }
.glow-warn::before, .glow-info::before {
  content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  border: 1px solid currentColor;
  animation: glowp 2.5s steps(5, jump-none) infinite;
}
.glow-warn::before { color: var(--warning); }
.glow-info::before { color: var(--info); }
@keyframes glowp {
  0%, 100% { box-shadow: 0 0 0 0 rgb(from currentColor r g b / 0); opacity: .7; }
  50% { box-shadow: 0 0 0 2px rgb(from currentColor r g b / .22); opacity: 1; }
}

/* Drag affordance for queued rows. */
.grip { opacity: 0; color: var(--fg-hint); cursor: grab; flex: none; display: flex; }
.witem:hover .grip { opacity: 1; }
.witem.dragging { opacity: .4; }
.witem.drop-above::after, .kcard.drop-above::after {
  content: ''; position: absolute; top: -1.5px; left: 6px; right: 6px; height: 2px;
  border-radius: 999px; background: var(--accent);
}
.kcard { position: relative; }

/* Expanded phase rows under a work item. */
.phlist { display: flex; flex-direction: column; gap: 0; padding: 1px 0 3px; }
.phrow {
  display: flex; align-items: center; gap: 7px; padding: 2px 8px 2px 28px;
  border-radius: var(--radius-field); cursor: pointer; min-width: 0;
}
.phrow:hover { background: color-mix(in oklab, var(--surface-2) 40%, transparent); }
.phrow .pn { font-size: 0.72rem; color: var(--fg-subtle); flex: none; }
.phrow.done .pn { color: var(--fg-subtle); }
.phrow.run .pn { color: var(--fg-muted); font-weight: 550; }
.phrow .pm { margin-left: auto; font-family: var(--font-mono); font-size: 9.5px; color: var(--fg-hint); white-space: nowrap; }
.phic { width: 12px; height: 12px; flex: none; display: flex; align-items: center; justify-content: center; }
.phlive {
  padding: 0 8px 2px 47px; font-size: 10px; font-family: var(--font-mono);
  color: var(--fg-hint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* Queue strip — global controls dock at the sidebar root. */
.qstrip {
  flex: none; border-top: 1px solid var(--border-subtle);
  padding: 7px 10px; display: flex; align-items: center; gap: 8px;
  background: color-mix(in oklab, var(--surface-1) 60%, transparent);
}
.qtog {
  display: flex; align-items: center; gap: 5px; padding: 2px 9px 2px 7px;
  border-radius: 999px; border: 1px solid; font-size: 11px; font-weight: 600;
}
.qtog.act { color: var(--success); border-color: color-mix(in oklab, var(--success) 45%, transparent); background: color-mix(in oklab, var(--success) 10%, transparent); }
.qtog.paused { color: var(--fg-subtle); border-color: var(--border); background: var(--surface-2); }
.slots { display: flex; gap: 2.5px; align-items: center; }
.slot { width: 11px; height: 5px; border-radius: 2px; background: var(--surface-2); border: 1px solid var(--border-subtle); }
.slot.on { background: var(--accent); border-color: transparent; }
.slot.paused { background: color-mix(in oklab, var(--fg-hint) 40%, transparent); }
.slotn { font-family: var(--font-mono); font-size: 10px; color: var(--fg-subtle); margin-left: 3px; }
.qneeds {
  margin-left: auto; display: flex; align-items: center; gap: 4px;
  font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
  color: var(--warning); background: color-mix(in oklab, var(--warning) 13%, transparent);
}
.qneeds:hover { background: color-mix(in oklab, var(--warning) 22%, transparent); }
.qneeds.clear { color: var(--fg-hint); background: color-mix(in oklab, var(--surface-2) 80%, transparent); }
.qboard { color: var(--fg-subtle); display: flex; padding: 3px; border-radius: var(--radius-field); }
.qboard:hover { color: var(--text-primary); background: color-mix(in oklab, var(--surface-2) 70%, transparent); }
.sb-foot {
  flex: none; display: flex; align-items: center; justify-content: space-between;
  padding: 6px 12px; font-size: 10.5px; color: var(--fg-hint);
  border-top: 1px solid var(--border-subtle);
}

/* ==================== Pane row ==================== */
.panes { flex: 1; min-width: 0; display: flex; }
.pane { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.pane + .pane { border-left: 1px solid var(--border-subtle); }
.pane.slidein { animation: slidein .16s ease-out; }
@keyframes slidein { from { transform: translateX(14px); opacity: 0; } to { transform: none; opacity: 1; } }
.pane-h {
  flex: none; height: 36px; display: flex; align-items: center; gap: 8px;
  padding: 0 12px; border-bottom: 1px solid var(--border-subtle); min-width: 0;
}
.pane-h .pt { font-size: 12.5px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pane-h .px { margin-left: auto; color: var(--fg-hint); display: flex; padding: 3px; border-radius: 4px; flex: none; }
.pane-h .px:hover { color: var(--text-primary); background: var(--surface-2); }
.pane-b { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px; }

.chip {
  display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px;
  line-height: 17px; padding: 0 7px; border-radius: 999px; white-space: nowrap;
  font-weight: 550; flex: none;
}
.c-proj { color: var(--fg-muted); background: var(--surface-2); }
.c-proj .pdot { width: 6px; height: 6px; border-radius: 2px; }
.c-ok { color: var(--success); background: color-mix(in oklab, var(--success) 13%, transparent); }
.c-warn { color: var(--warning); background: color-mix(in oklab, var(--warning) 13%, transparent); }
.c-err { color: var(--error); background: color-mix(in oklab, var(--error) 13%, transparent); }
.c-info { color: var(--info); background: color-mix(in oklab, var(--info) 13%, transparent); }
.c-acc { color: color-mix(in oklab, var(--accent) 55%, var(--text-primary)); background: color-mix(in oklab, var(--accent) 16%, transparent); }
.c-mut { color: var(--fg-subtle); background: color-mix(in oklab, var(--surface-2) 85%, transparent); }
.mono { font-family: var(--font-mono); }

.btn {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 550;
  padding: 4.5px 11px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface-1); color: var(--fg-muted);
}
.btn:hover { border-color: var(--border-strong); color: var(--text-primary); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: white; }
.btn.pri:hover { background: color-mix(in oklab, var(--accent) 88%, white); }
.btn.ok { background: color-mix(in oklab, var(--success) 22%, var(--surface-1)); border-color: color-mix(in oklab, var(--success) 45%, transparent); color: color-mix(in oklab, var(--success) 75%, white); }
.btn.err { border-color: color-mix(in oklab, var(--error) 40%, var(--border)); color: color-mix(in oklab, var(--error) 80%, white); }
.btn.err:hover { background: color-mix(in oklab, var(--error) 14%, transparent); }
.btn .kbd { margin-left: 2px; }

.card {
  background: var(--surface-1); border: 1px solid var(--border-subtle);
  border-radius: 12px;
}

/* Live shimmer band (composer working-state treatment from app.css). */
.shimband { position: relative; overflow: hidden; height: 2px; background: color-mix(in oklab, var(--accent) 18%, transparent); }
.shimband::before {
  content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 50%;
  background: linear-gradient(90deg, transparent, color-mix(in oklab, var(--accent) 75%, transparent), transparent);
  animation: shim 1.6s ease-in-out infinite alternate;
}
@keyframes shim { from { transform: translateX(-50%); } to { transform: translateX(150%); } }

/* Segmented phase progress. */
.segbar { display: flex; gap: 3px; }
.seg { flex: 1; height: 4px; border-radius: 2px; background: var(--surface-2); }
.seg.done { background: color-mix(in oklab, var(--success) 55%, var(--surface-2)); }
.seg.run { background: var(--accent); }

/* Diff rendering. */
.diff { font-family: var(--font-mono); font-size: 11.5px; border: 1px solid var(--border-subtle); border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
.dfh {
  display: flex; align-items: center; gap: 8px; padding: 4.5px 10px;
  background: var(--surface-1); font-size: 11px; cursor: pointer; min-width: 0;
}
.dfh .fp { color: var(--fg-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dfh .plus { color: var(--success); } .dfh .minus { color: var(--error); }
.dl { padding: 1px 10px; white-space: pre-wrap; color: var(--fg-subtle); }
.dl.add { background: color-mix(in oklab, var(--success) 10%, transparent); color: color-mix(in oklab, var(--success) 55%, var(--text-primary)); }
.dl.del { background: color-mix(in oklab, var(--error) 10%, transparent); color: color-mix(in oklab, var(--error) 55%, var(--text-primary)); }
.dl.hunk { background: var(--surface-1); color: var(--fg-hint); padding-top: 2px; padding-bottom: 2px; }

/* Tabs (gate review). */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border-subtle); margin-bottom: 12px; }
.tab { padding: 5px 11px; font-size: 12px; color: var(--fg-subtle); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab:hover { color: var(--fg-muted); }
.tab.on { color: var(--text-primary); border-color: var(--accent); }

/* Checks row. */
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.check {
  display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono);
  font-size: 11px; padding: 3px 9px; border-radius: 999px;
  background: color-mix(in oklab, var(--success) 9%, var(--surface-1));
  border: 1px solid color-mix(in oklab, var(--success) 25%, transparent);
  color: color-mix(in oklab, var(--success) 60%, var(--text-primary));
}
.check .d { color: var(--fg-hint); }

/* Kanban board (secondary surface). */
.board { display: flex; gap: 10px; align-items: flex-start; min-width: max-content; padding-bottom: 8px; }
.kcol { width: 178px; flex: none; }
.kcol-h { display: flex; align-items: center; gap: 6px; padding: 0 2px 2px; }
.kcol-h .cnt { font-family: var(--font-mono); font-size: 10px; color: var(--fg-hint); }
.kcard {
  background: var(--surface-1); border: 1px solid var(--border-subtle);
  border-left-width: 2px; border-radius: 8px; padding: 7px 9px; margin-top: 6px; cursor: pointer;
}
.kcard:hover { border-color: var(--border-strong); border-left-color: inherit; }
.kcard .kt { font-size: 11.5px; line-height: 1.35; color: var(--fg-muted);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.kcard .kmeta { margin-top: 6px; display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.kcard .kproj { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--fg-subtle); margin-bottom: 4px; }

/* Stepper. */
.stepwrap { max-width: 640px; margin: 18px auto 0; }
.stephead { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.sdots { display: flex; gap: 5px; margin-left: auto; }
.sdot { width: 7px; height: 7px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); }

<script>

const MOMENTS = [
  { n: 1, tab: 'Queue',        title: 'Queue overview',
    desc: 'The sidebar is the queue. Board is one click away — orientation only.' },
  { n: 2, tab: 'Running',      title: 'Running card',

  { n: 3, tab: 'Stepper',      title: 'Morning-after stepper',

  { n: 4, tab: 'Gate',         title: 'Gate review',
    desc: 'Human gate leads with the diff and check results; envelope demoted to tabs.' },
  { n: 5, tab: 'Intake',       title: 'Intake',

    desc: 'Done is a decision: merge / PR / discard — or the auto-merge after-the-fact read.' },
];

/* ============ Mutable UI state ============ */
const S = {
  m: 1, ann: false, queueActive: true,
  qorder: [6, 7],                    // manual priority (drag to reorder)
  step: 0, resolved: {},             // stepper: itemId -> {kind, msg}
  gateTab: 'review',
  phaseOpen: false,                  // moment 6 second pane
  cancelArm: false, cancelDone: false, // moment 2 cancel flow
  intakeWf: 'bv', intakeProj: 'ao', enqFlash: false, chatQueued: false,
  diffOpen: { 0: true, 1: true, 2: false, 3: false },
};

/* ============ Icons (14px stroke glyphs, lucide-style) ============ */
function svg(paths, sz = 12, sw = 2) {
  return '<svg width="' + sz + '" height="' + sz + '" viewBox="0 0 24 24" fill="none" ' +
    'stroke="currentColor" stroke-width="' + sw + '" stroke-linecap="round" stroke-linejoin="round">' + paths + '</svg>';
}
const IC = {
  chev: svg('<path d="m9 18 6-6-6-6"/>'),
  plus: svg('<path d="M5 12h14M12 5v14"/>'),
  x: svg('<path d="M18 6 6 18M6 6l12 12"/>', 13),
  chat: svg('<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>', 11),
  play: svg('<polygon points="6 3 20 12 6 21 6 3"/>', 10, 2.5),
  pause: svg('<path d="M10 4H6v16h4zM18 4h-4v16h4z"/>', 10, 2.5),

  grip: svg('<circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/>', 12, 2.4),

  robot: svg('<rect x="5" y="8" width="14" height="12" rx="2"/><path d="M12 4v4M8 13h.01M16 13h.01"/>', 10),
  branch: svg('<line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>', 11),
  arrow: svg('<path d="M5 12h14m-6-6 6 6-6 6"/>', 11),
  take: svg('<path d="m15 15 6 6m-6-6v4.8m0-4.8h4.8"/><path d="M9 19.8V15m0 0H4.2M9 15l-6 6"/><path d="M15 4.2V9m0 0h4.8M15 9l6-6"/><path d="M9 4.2V9m0 0H4.2M9 9 3 3"/>', 11),
  redo: svg('<path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/>', 11),
  trash: svg('<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>', 11),
  gear: svg('<circle cx="12" cy="12" r="3"/><path d="M12 1v4m0 14v4M4.2 4.2l2.8 2.8m10 10 2.8 2.8M1 12h4m14 0h4M4.2 19.8l2.8-2.8m10-10 2.8-2.8"/>', 11),
  merge: svg('<circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/>', 11),
  pr: svg('<circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7M6 9v12"/>', 11),
  eye: svg('<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>', 11),
  file: svg('<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>', 11),
  term: svg('<polyline points="4 17 10 11 4 5"/><line x1="12" x2="20" y1="19" y2="19"/>', 11),

};
const STICON = {
  running: '<span class="wic st-run pulse">' + IC.dot + '</span>',
  gate: '<span class="wic st-gate">' + IC.alert + '</span>',
  question: '<span class="wic st-q">' + IC.q + '</span>',

function needsCount() { return PARKED.filter(id => !S.resolved[id]).length; }
function isResolved(id) { return !!S.resolved[id]; }

/* ============================================================
   Sidebar — the concept centerpiece. Threads stay untouched at
   the top of each project; WORK is a labeled sibling section.
   ============================================================ */
const THREADS = {
  ao:  ['pane focus refactor notes', 'ws reconnect repro session'],
  m32: ['session pooling design chat'],
  dsp: ['profile loader sketch'],
};
// Per-moment sidebar posture: which projects/work sections/items are open.
function sbConfig() {
  switch (S.m) {
    case 1: return { open: ['ao','m32','dsp'], work: ['ao','m32'], items: [], hi: null };
    case 2: return { open: ['ao'], work: ['ao'], items: [1], hi: 1 };
    case 3: return { open: ['ao','m32','dsp'], work: ['ao','m32','dsp'], items: [], hi: needsCount() > 0 ? PARKED[Math.min(S.step, PARKED.length - 1)] : null };
    case 4: return { open: ['ao'], work: ['ao'], items: [], hi: 2 };

    case 6: return { open: ['ao'], work: ['ao'], items: [1], hi: 1 };

}
// Attention-first ordering inside each Work section.
const ORDER = { gate: 0, question: 0, failed: 1, running: 2, queued: 3, done: 4, cancelled: 5 };
function workItemsFor(pid) {
  let ids = Object.keys(ITEMS).map(Number).filter(id => ITEMS[id].p === pid);
  ids.sort((a, b) => {
    const oa = ORDER[ITEMS[a].st], ob = ORDER[ITEMS[b].st];
    if (oa !== ob) return oa - ob;
    if (ITEMS[a].st === 'queued') return S.qorder.indexOf(a) - S.qorder.indexOf(b);
    return a - b;
  });
  return ids;
}
function rollupChips(pid) {
  const ids = workItemsFor(pid);
  let need = 0, run = 0, done = 0, rest = 0;
  for (const id of ids) {
    const st = ITEMS[id].st;
    const res = isResolved(id);

    else if (st === 'done') done++;

function stateChip(id) {

function go(m) {
  if (m < 1 || m > 7 || m === S.m) return;
  S.m = m;
  if (m !== 2) { S.cancelArm = false; S.cancelDone = false; }
  if (m === 6) S.phaseOpen = false;
  history.replaceState(null, '', '#m' + m);
  render();
}

/* ============ Stepper resolution ============ */
const RES_MSG = {
  approve: { cls: 'g', tag: 'approved', msg: 'Approved — gate routed onward to docs. Item resumes running.' },
  reject:  { cls: 'r', tag: 'rejected', msg: 'Rejected — looping back to review with your note as feedback (bounded, §4).' },
  take:    { cls: 'b', tag: 'took over', msg: 'Taking over — phase thread opens as a pane; finish with Complete or discard + re-run (§7).' },
  answer:  { cls: 'b', tag: 'answered', msg: 'Answer injected as a variable — implement resumes its own schema’d turn. No interrupt needed.' },
  requeue: { cls: 'g', tag: 're-enqueued', msg: 'Re-enqueued at the top with diagnosis attached — starts when a slot frees.' },
  discard: { cls: 'r', tag: 'discarded', msg: 'Discarded — run record kept, worktree reclaimed.' },
  triage:  { cls: 'b', tag: 'triaging', msg: 'Triage thread opened in the item worktree, pre-seeded with run record + diffs + typed reason (D4.2).' },
};
function currentStepId() { return PARKED[S.step]; }
function resolveStep(kind) {
  const id = currentStepId();
  if (S.resolved[id]) return;
  const it = ITEMS[id];
  const gateOnly = kind === 'approve' || kind === 'reject';
  if (gateOnly && it.st !== 'gate') { bounce(); return; }
  if (kind === 'requeue' && it.st !== 'failed') { bounce(); return; }
  S.resolved[id] = RES_MSG[kind];
  render();
  setTimeout(() => {
    const next = PARKED.findIndex((pid, i) => i > S.step && !S.resolved[pid]);
    const anyLeft = PARKED.some(pid => !S.resolved[pid]);
    if (next >= 0) S.step = next;
    else if (anyLeft) S.step = PARKED.findIndex(pid => !S.resolved[pid]);
    render();
  }, 900);
}
function bounce() {
  const el = document.getElementById('scard');
  if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
}
function stepMove(d) {
  const n = S.step + d;
  if (n < 0 || n >= PARKED.length) { bounce(); return; }
  S.step = n; render();
}

/* ============ Event delegation ============ */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-moment],[data-act],[data-tab],[data-difftoggle],[data-iproj],[data-iwf],[data-intake],[data-openphase]');
  if (!t) return;
  if (t.dataset.moment) { go(Number(t.dataset.moment)); return; }
  if (t.dataset.tab) { S.gateTab = t.dataset.tab; render(); return; }
  if (t.dataset.difftoggle !== undefined) {
    S.diffOpen[t.dataset.difftoggle] = !S.diffOpen[t.dataset.difftoggle]; render(); return;
  }
  if (t.dataset.iproj) { S.intakeProj = t.dataset.iproj; render(); return; }
  if (t.dataset.iwf) { S.intakeWf = t.dataset.iwf; render(); return; }
  if (t.dataset.intake) { go(5); return; }
  if (t.dataset.openphase) {
    if (S.m === 6) { S.phaseOpen = true; render(); }
    return;
  }
  switch (t.dataset.act) {
    case 'qtoggle': S.queueActive = !S.queueActive; render(); break;
    case 'stepper': go(3); break;
    case 'board': go(1); break;
    case 'gomoment4': case 'gomoment4b': go(4); break;
    case 'closephase': S.phaseOpen = false; render(); break;
    case 'cancel1': S.cancelArm = true; render(); break;
    case 'cancel0': S.cancelArm = false; render(); break;
    case 'cancel2': S.cancelArm = false; S.cancelDone = true; render(); break;
    case 'enqueue': S.enqFlash = true; render(); break;
    case 'chatqueue': S.chatQueued = true; render(); break;
    case 's-approve': if (t.dataset.fromGate) { S.step = 0; } resolveStep('approve'); if (t.dataset.fromGate) go(3); break;
    case 's-reject': if (t.dataset.fromGate) { S.step = 0; } resolveStep('reject'); if (t.dataset.fromGate) go(3); break;
    case 's-take': if (t.dataset.fromGate) { S.step = 0; } resolveStep('take'); if (t.dataset.fromGate) go(3); break;
    case 's-requeue': resolveStep('requeue'); break;
    case 's-discard': resolveStep('discard'); break;
    case 's-triage': resolveStep('triage'); break;
    case 's-answer': submitAnswer(); break;
    case 's-reset': S.resolved = {}; S.step = 0; render(); break;
  }
});
function submitAnswer() {
  const inp = document.getElementById('ansin');
  if (!inp || !inp.value.trim()) { bounce(); if (inp) inp.focus(); return; }
  resolveStep('answer');
}

/* Drag-reorder for queued items (sidebar rows + board cards). */
let dragId = null;
document.addEventListener('dragstart', (e) => {
  const el = e.target.closest('[data-drag]');
  if (!el) return;
  dragId = Number(el.dataset.drag);
  el.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
});
document.addEventListener('dragover', (e) => {
  const el = e.target.closest('[data-drag]');
  document.querySelectorAll('.drop-above').forEach(x => x.classList.remove('drop-above'));
  if (!el || dragId === null || Number(el.dataset.drag) === dragId) return;
  e.preventDefault();
  el.classList.add('drop-above');
});
document.addEventListener('drop', (e) => {
  const el = e.target.closest('[data-drag]');
  if (!el || dragId === null) return;
  e.preventDefault();
  const target = Number(el.dataset.drag);
  const from = S.qorder.indexOf(dragId), to = S.qorder.indexOf(target);
  if (from >= 0 && to >= 0) { S.qorder.splice(from, 1); S.qorder.splice(to, 0, dragId); }
  dragId = null; render();
});
document.addEventListener('dragend', () => {
  dragId = null;
  document.querySelectorAll('.dragging,.drop-above').forEach(x => x.classList.remove('dragging', 'drop-above'));
});

/* ============ Keyboard ============ */
document.addEventListener('keydown', (e) => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if (typing) {
    if (e.key === 'Enter' && e.target.id === 'ansin') { e.preventDefault(); submitAnswer(); }
    if (e.key === 'Escape') e.target.blur();
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key >= '1' && e.key <= '7') { go(Number(e.key)); return; }
  if (e.key === 'i') { S.ann = !S.ann; render(); return; }
  if (S.m === 6 && e.key === 'Escape' && S.phaseOpen) { S.phaseOpen = false; render(); return; }
  if (S.m === 4) {
    if (e.key === 'a') { S.step = 0; resolveStep('approve'); go(3); return; }
    if (e.key === 'r') { S.step = 0; resolveStep('reject'); go(3); return; }
    if (e.key === 't') { S.step = 0; resolveStep('take'); go(3); return; }
  }
  if (S.m !== 3) return;
  switch (e.key) {
    case 'j': case 'ArrowDown': stepMove(1); break;
    case 'k': case 'ArrowUp': stepMove(-1); break;
    case 'a': resolveStep('approve'); break;
    case 'r': resolveStep('reject'); break;
    case 't': resolveStep('take'); break;
    case 'e': resolveStep('requeue'); break;
    case 'x': resolveStep('discard'); break;
    case 'Enter': if (ITEMS[currentStepId()].st === 'gate') go(4); break;
  }
});

/* Elapsed ticker for the running card (liveness). */
let elapsedSec = 14 * 60 + 7;
setInterval(() => {
  elapsedSec++;
  const el = document.getElementById('elapsed');
  if (el && !S.cancelDone) el.textContent = Math.floor(elapsedSec / 60) + 'm ' + String(elapsedSec % 60).padStart(2, '0') + 's';
}, 1000);

/* Boot — honor #m<n> deep links. */
const hm = location.hash.match(/^#m([1-7])$/);
if (hm) S.m = Number(hm[1]);
document.getElementById('annbtn').addEventListener('click', () => { S.ann = !S.ann; render(); });
render();
</script>
</body>
